<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valles Management System</title>
<style>
  :root{
    --bg:#F4F6FA;
    --card:#FFFFFF;
    --ink:#1C2430;
    --ink-soft:#4A5468;
    --muted:#8A93A6;
    --rule:#E4E8EF;
    --accent:#5B6CF9;
    --accent-soft:#EDEFFF;
    --good:#1F9D63;
    --good-soft:#E6F7EE;
    --bad:#E5483F;
    --bad-soft:#FDEBEA;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --radius: 12px;
    /* dashboard gradient palette, mirrors reference screenshot */
    --g-blue: linear-gradient(135deg,#3E7BFA,#2455D8);
    --g-orange: linear-gradient(135deg,#F79433,#E1631C);
    --g-green: linear-gradient(135deg,#33B36B,#1D8E51);
    --g-purple: linear-gradient(135deg,#9B63E8,#7635CE);
    --g-red: linear-gradient(135deg,#EB5A50,#C6352A);
    --g-amber: linear-gradient(135deg,#F5A623,#D6810C);
    --g-teal: linear-gradient(135deg,#1FB6A6,#0D8C7F);
    --g-pink: linear-gradient(135deg,#EE6FA6,#D1447F);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:inherit;}

  /* Top bar */
  .topnav{background:#fff;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20;}
  .topnav-inner{display:flex;align-items:center;gap:6px;padding:0 20px;max-width:1400px;margin:0 auto;overflow-x:auto;}
  .brand{display:flex;align-items:center;gap:9px;padding:14px 14px 14px 0;margin-right:6px;border-right:1px solid var(--rule);}
  .brand-logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:0 0 32px;overflow:hidden;}
  .brand-logo img{width:100%;height:100%;object-fit:cover;}
  .brand-name{font-weight:700;font-size:13.5px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
  .brand-sub{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.2;}

  .nav-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:10px 14px;border-radius:10px;border:none;background:transparent;color:var(--ink-soft);
    font-size:11.5px;white-space:nowrap;position:relative;min-width:74px;
  }
  .nav-item .ic{font-size:17px;line-height:1;}
  .nav-item:hover{background:#F3F4FA;}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700;}
  .nav-item .badge{position:absolute;top:4px;right:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;border-radius:20px;padding:1px 5px;min-width:14px;text-align:center;}
  .nav-item .badge.amber{background:var(--amber,#E1961A);}

  .main-wrap{max-width:1400px;margin:0 auto;padding:22px 20px 60px;}
  .pageh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .pageh h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.01em;}
  .pageh .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:20px;box-shadow:0 1px 2px rgba(20,30,50,.03);}
  .card + .card{margin-top:16px;}
  .card h2{font-size:15.5px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card h2 .tag{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--bg);padding:2px 6px;border-radius:4px;letter-spacing:.05em;}

  .grid{display:grid;gap:14px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  @media(max-width:900px){.stat-row{grid-template-columns:1fr 1fr;}}
  .stat{border-radius:16px;padding:20px 20px;color:#fff;position:relative;overflow:hidden;min-height:96px;}
  .stat .n{font-size:30px;font-weight:800;position:relative;}
  .stat .l{font-size:12.5px;margin-top:5px;position:relative;opacity:.95;display:flex;align-items:center;gap:6px;}
  .stat .l .ic{font-size:14px;}

  label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .hint{font-size:11px;color:var(--muted);margin-top:5px;}
  input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],input[type=email],input[type=tel],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:#FCFDFE;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  textarea{resize:vertical;min-height:60px;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);text-transform:none;}
  .checkline input{width:auto;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid transparent;
    font-size:13.5px;font-weight:700;letter-spacing:.01em;background:var(--accent);color:#fff;
  }
  .btn:hover{background:#4658E0;}
  .btn.secondary{background:#fff;color:var(--ink);border-color:var(--rule);}
  .btn.secondary:hover{background:var(--bg);}
  .btn.danger{background:var(--bad);color:#fff;}
  .btn.danger:hover{background:#C63A31;}
  .btn.sm{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  .lineitem-table{font-size:12px;}
  .txn-list-table td{vertical-align:top;padding-top:10px;padding-bottom:10px;}
  .txn-list-table .pill{margin-top:2px;display:inline-block;}
  .lineitem-table th{padding:4px 6px;text-align:left;color:var(--muted);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.03em;border-bottom:1px solid var(--rule);white-space:nowrap;}
  .lineitem-table td{padding:3px 4px;vertical-align:middle;}
  .lineitem-table input, .lineitem-table select{width:100%;padding:5px 6px;font-size:12px;border:1px solid var(--rule);border-radius:6px;background:var(--card);}
  .lineitem-table input:disabled{background:var(--bg);color:var(--muted);}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    padding:8px 10px;border-bottom:1px solid var(--rule);
  }
  tbody td{padding:10px 10px;border-bottom:1px solid #F0F2F6;vertical-align:middle;}
  tbody tr:hover{background:#FAFBFD;}
  .num-cell{font-family:var(--mono);text-align:right;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .pill.good{background:var(--good-soft);color:var(--good);}
  .pill.bad{background:var(--bad-soft);color:var(--bad);}
  .pill.neutral{background:var(--bg);color:var(--ink-soft);}
  .pill.accent{background:var(--accent-soft);color:var(--accent);}
  .pill.warn{background:#FDF0DC;color:#B5720A;}

  .empty{text-align:center;padding:44px 20px;color:var(--muted);}
  .empty .icon{font-size:30px;margin-bottom:8px;}
  .empty .cta{margin-top:14px;}

  .overlay{position:fixed;inset:0;background:rgba(20,30,50,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;padding:24px;box-shadow:0 20px 50px rgba(20,30,50,.25);}
  .modal.wide{max-width:840px;}
  .modal.xwide{max-width:min(1320px, 95vw);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{font-size:18px;margin:0;font-weight:800;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--muted);padding:4px 8px;border-radius:6px;}
  .modal-close:hover{background:var(--bg);}

  .divider{height:1px;background:var(--rule);margin:16px 0;}
  .section-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:18px 0 10px;font-weight:700;}
  .section-label:first-child{margin-top:0;}

  .search-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .search-bar input,.search-bar select{flex:1;min-width:150px;}

  .lock-screen{max-width:380px;margin:60px auto;text-align:center;}
  .lock-screen .seal{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px;}
  .lock-screen p{color:var(--muted);font-size:13px;}

  .file-drop{border:1.5px dashed var(--rule);border-radius:10px;padding:16px;text-align:center;background:var(--bg);cursor:pointer;}
  .file-drop:hover{border-color:var(--accent);}
  .file-chip{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;margin-top:6px;font-size:12.5px;}
  .file-chip .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-chip button{background:none;border:none;color:var(--bad);font-size:13px;}

  .toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100;}
  .toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.2);animation:slidein .2s ease;}
  .toast.err{background:var(--bad);}
  @keyframes slidein{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  /* Payslip — matches company salary-slip layout */
  .payslip{background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:26px;}
  .payslip-top{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:0;}
  .payslip-top .logo{width:66px;height:66px;border-radius:50%;border:2px solid var(--ink);flex:0 0 66px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800;font-size:22px;}
  .payslip-top .logo img{width:100%;height:100%;object-fit:cover;}
  .payslip-top .conameblock{text-align:center;flex:1;}
  .payslip-top .coname{font-size:19px;font-weight:800;letter-spacing:.01em;}
  .payslip-addr{text-align:center;font-size:11px;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--ink);}
  .payslip-title{text-align:center;font-size:15px;font-weight:800;padding:9px 0;border-bottom:1px solid var(--ink);letter-spacing:.04em;}
  .pstable{width:100%;border-collapse:collapse;font-size:12.5px;}
  .pstable td{border:1px solid var(--ink);padding:6px 9px;}
  .pstable td.lbl{color:var(--ink-soft);width:19%;font-size:11px;}
  .pstable td.val{font-weight:700;width:31%;}
  .earnhead td{font-weight:800;font-size:13px;background:#F4F6FA;}
  .amtcell{text-align:right;font-family:var(--mono);}
  .totrow td{font-weight:800;background:#F4F6FA;}
  .netrow td{font-weight:800;background:#EAF6EF;color:var(--good);font-size:14px;}
  .payslip-foot{font-size:10.5px;color:var(--muted);padding-top:10px;display:flex;justify-content:space-between;}
  .pstable tr.wordsrow td{font-size:11px;padding:8px 9px;font-style:italic;color:var(--ink-soft);background:#FAFBFD;}
  .pstable tr.wordsrow .wlabel{font-weight:800;font-style:normal;text-transform:uppercase;letter-spacing:.05em;font-size:10px;color:var(--ink);}
  /* The many-column line-items table shares .pstable/.val with the 4-column detail grid
     above it, but a 31%-per-cell width (correct for 4 columns) causes severe overflow across
     8 columns — this resets it to fit the table's actual content instead. */
  .items-table{table-layout:auto;}
  .items-table td.val{width:auto;font-weight:600;font-size:10.5px;padding:4px 6px;}
  .items-table td.lbl{width:auto;}
  .regime-note{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.6;border-top:1px dashed var(--rule);padding-top:8px;}

  .app-footer{margin:34px 0 8px;padding-top:16px;border-top:1px solid var(--rule);text-align:center;font-size:11.5px;color:var(--muted);line-height:1.9;}
  .app-footer div:first-child{font-weight:600;color:var(--ink-soft);}

  @media print{
    @page{ size:A4; margin:8mm; }
    body > *:not(.overlay){ display:none !important; }
    .overlay{position:static !important;inset:auto !important;display:block !important;padding:0 !important;overflow:visible !important;background:none !important;}
    .modal{position:static !important;max-width:100% !important;box-shadow:none !important;}
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:static;width:100%;padding:0;margin:0;}
    #printArea img{display:block !important;}
    .payslip, .payslip *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
    .items-table{font-size:9.5px;}
    .pstable td{padding:4px 7px;line-height:1.25;}
    .payslip-top{margin-bottom:6px;}
    .payslip-title{margin:6px 0;}
    .no-print{display:none !important;}
  }
</style>
</head>
<body>

<div class="topnav">
  <div class="topnav-inner">
    <div class="brand">
      <div class="brand-logo" id="sbLogo">V</div>
      <div>
        <div class="brand-name" id="sbCompanyName">Valles India Tech Services</div>
        <div class="brand-sub" id="sbProduct">Valles Management System</div>
      </div>
    </div>
    <nav id="navList" style="display:flex;">
      <button class="nav-item" data-tab="dashboard"><span class="ic">🏠</span>Dashboard</button>
      <button class="nav-item" data-tab="transactions"><span class="ic">📑</span>Transactions</button>
      <button class="nav-item" data-tab="staff"><span class="ic">👥</span>Staff<span class="badge" id="compBadge" style="display:none;">0</span></button>
      <button class="nav-item" data-tab="expenses"><span class="ic">🧾</span>Bills &amp; Expenses</button>
      <button class="nav-item" data-tab="taxcompliance"><span class="ic">📊</span>Tax Compliance</button>
      <button class="nav-item" data-tab="parties"><span class="ic">🤝</span>Parties</button>
      <button class="nav-item" data-tab="documents"><span class="ic">📄</span>Documents<span class="badge" id="docBadge" style="display:none;">0</span></button>
      <button class="nav-item" data-tab="settings"><span class="ic">🔒</span>Settings</button>
    </nav>
    <div id="navPresenceBadge" class="no-print" style="margin-left:auto;padding-left:8px;white-space:nowrap;"></div>
    <div id="navDriveBadge" class="no-print" style="padding-left:12px;white-space:nowrap;"></div>
  </div>
</div>

<div class="main-wrap">
  <div class="pageh">
    <div>
      <h1 id="topTitle">Dashboard</h1>
      <div class="sub" id="topSub">Overview of employees, payroll and compliance</div>
    </div>
    <div class="btn-row no-print" id="topActions"></div>

  <div id="content"></div>
  <footer class="app-footer no-print">
    <div>&copy; 2026 EASY MS &ndash; Management System. All rights reserved.</div>
    <div>Powered by Valles India Tech Services Pvt.Ltd</div>
    <div>Version 1.0.0</div>
  </footer>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================= LOCAL STORAGE (fast local cache) ============================= */
/* This app is designed to be deployed as a static site (e.g. GitHub Pages), so it has no
   server of its own. All data lives in the browser via localStorage as a working cache,
   and — once you connect Google Drive in Settings — is synced to a JSON file in your own
   Drive account (the durable, off-device copy), plus rotating 5-file backups. See README.md
   for deployment + Drive setup. */
const LS_KEY = 'vallesEasyEmsData_v1';
let LOCAL = null;
function ensureLocal(){
  if(LOCAL) return LOCAL;
  try{
    const raw = localStorage.getItem(LS_KEY);
    LOCAL = raw ? JSON.parse(raw) : {};
  }catch(e){
    /* This should never happen — but if the saved data is ever unreadable, silently
       resetting to blank would look exactly like "all my data vanished" with zero
       explanation. So instead: preserve the unreadable copy under a recovery key and
       warn loudly, rather than discarding it. */
    try{ localStorage.setItem(LS_KEY+'_corrupt_backup_'+Date.now(), localStorage.getItem(LS_KEY)||''); }catch(e2){}
    LOCAL = {};
    setTimeout(()=> toast('⚠ Saved data could not be read and was reset — this should not normally happen. An unreadable copy was preserved in this browser; restore from Google Drive or contact support before making further changes.', true), 400);
  }
  if(!LOCAL.compliance) LOCAL.compliance = {};
  if(!LOCAL.tombstones) LOCAL.tombstones = {};
  if(!LOCAL.presence) LOCAL.presence = {};
  return LOCAL;
}
function recordTombstone(kind, id){
  ensureLocal();
  if(!LOCAL.tombstones[kind]) LOCAL.tombstones[kind] = {};
  LOCAL.tombstones[kind][id] = new Date().toISOString();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); }catch(e){}
}
async function getJSON(key, def){
  ensureLocal();
  if(key==='org-profile') return LOCAL.org!=null ? LOCAL.org : def;
  if(key==='employees') return LOCAL.employees!=null ? LOCAL.employees : def;
  if(key==='payslips') return LOCAL.payslips!=null ? LOCAL.payslips : def;
  if(key==='parties') return LOCAL.parties!=null ? LOCAL.parties : def;
  if(key==='documents') return LOCAL.documents!=null ? LOCAL.documents : def;
  if(key==='transactions') return LOCAL.transactions!=null ? LOCAL.transactions : def;
  if(key==='expenses') return LOCAL.expenses!=null ? LOCAL.expenses : def;
  if(key.indexOf('compliance:')===0){ const v = LOCAL.compliance[key.slice(11)]; return v!=null ? v : def; }
  return def;
}
async function setJSON(key, value){
  ensureLocal();
  if(key==='org-profile') LOCAL.org = value;
  else if(key==='employees') LOCAL.employees = value;
  else if(key==='payslips') LOCAL.payslips = value;
  else if(key==='parties') LOCAL.parties = value;
  else if(key==='documents') LOCAL.documents = value;
  else if(key==='transactions') LOCAL.transactions = value;
  else if(key==='expenses') LOCAL.expenses = value;
  else if(key.indexOf('compliance:')===0){ LOCAL.compliance[key.slice(11)] = value; }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); }
  catch(e){ toast('Local save failed — browser storage may be full. Try removing large documents.', true); return false; }
  driveDirty = true;
  scheduleDriveSync();
  return true;
}
function buildPayload(){
  ensureLocal();
  return { app:'Valles Management System', version:2, savedAt:new Date().toISOString(),
    org:ORG, employees:EMPLOYEES, payslips:PAYSLIPS, compliance:COMPLIANCE,
    parties:PARTIES, documents:COMPANY_DOCS, transactions:TRANSACTIONS, expenses:EXPENSES, reimbursements:REIMBURSEMENTS,
    presence:LOCAL.presence, tombstones:LOCAL.tombstones };
}

/* ============================= STATE ============================= */
let ORG = null, EMPLOYEES = [], PAYSLIPS = [], COMPLIANCE = {}, PARTIES = [], COMPANY_DOCS = [], TRANSACTIONS = [], EXPENSES = [], REIMBURSEMENTS = [];
let settingsUnlocked = false;
let activeTab = 'dashboard';

const DEFAULT_ORG = {
  companyName: "Your Company Pvt. Ltd.",
  address: "", tel:"", email:"",
  cin: "", pan: "", tan: "", gstin: "", logo: "",
  bankName: "", bankAccNo: "", bankIFSC: "", bankBranch: "",
  ptSlabs: [ {min:0, max:15000, amount:0}, {min:15001, max:20000, amount:150}, {min:20001, max:1000000000, amount:200} ],
  /* Many states cap total annual Professional Tax at a fixed amount, made up with a larger
     deduction in February — e.g. Maharashtra: ₹200 × 11 months + ₹300 in Feb = ₹2,500/year
     exactly. Set to 0 to disable the February top-up for states that don't do this. */
  ptAnnualCap: 2500,
  applyPfCeiling: false, pfCeiling: 15000,
  /* CTC structuring policy: given ONE CTC number, this is how the full monthly breakdown
     is derived. See "Revise by CTC" in Salary Revision. Editable in Settings. */
  ctcPolicy: { basicPct: 0.50, childrenEducation: 200, defaultReimbursement: 40000 },
  /* Income-tax rules for both regimes — editable in Settings so HR can update them when the
     government revises slabs/rates in a future Budget, without needing the app rebuilt.
     Defaults below are the FY2025-26 rules this app shipped with. slabs: [cap, rate] pairs,
     cap:null means "and above". surcharge: [incomeAbove, rate] tiers. */
  taxNew: {
    stdDeduction: 75000, rebateThreshold: 1200000, cess: 0.04,
    slabs: [[400000,0],[800000,0.05],[1200000,0.10],[1600000,0.15],[2000000,0.20],[2400000,0.25],[null,0.30]],
    surcharge: [[5000000,0.10],[10000000,0.15],[20000000,0.25]]
  },
  taxOld: {
    stdDeduction: 50000, rebateThreshold: 500000, cess: 0.04,
    slabs: [[250000,0],[500000,0.05],[1000000,0.20],[null,0.30]],

/* No symbol — for wherever a currency symbol is explicitly prepended already (multi-currency
   transactions), since money()/money2() always hardcode a rupee symbol regardless of actual

function timeAgo(iso){
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/1000));
  if(s < 60) return 'just now';
  if(s < 3600) return Math.round(s/60)+'m ago';
  if(s < 86400) return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}

/* Indian numbering system — rupees in words (lakh/crore), used on the payslip */
const W_ONES = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve',
  'Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const W_TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function twoDigitWords(n){
  if(n < 20) return W_ONES[n];
  return W_TENS[Math.floor(n/10)] + (n%10 ? ' ' + W_ONES[n%10] : '');
}
function threeDigitWords(n){
  let out = '';
  if(n > 99){ out += W_ONES[Math.floor(n/100)] + ' Hundred'; if(n%100) out += ' '; }
  if(n%100) out += twoDigitWords(n%100);
  return out;
}
function integerToIndianWords(n){
  n = Math.floor(Math.abs(Number(n)||0));
  if(n === 0) return 'Zero';
  const parts = [];
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lakh  = Math.floor(n / 100000);   n %= 100000;
  const thou  = Math.floor(n / 1000);     n %= 1000;
  const rest  = n;
  if(crore) parts.push(integerToIndianWords(crore) + ' Crore');
  if(lakh)  parts.push(twoDigitWords(lakh) + ' Lakh');
  if(thou)  parts.push(twoDigitWords(thou) + ' Thousand');
  if(rest)  parts.push(threeDigitWords(rest));
  return parts.join(' ');
}
const CURRENCY_WORDS = {
  INR:{major:'Rupees', minor:'Paise'}, USD:{major:'US Dollars', minor:'Cents'},
  EUR:{major:'Euros', minor:'Cents'}, GBP:{major:'Pounds Sterling', minor:'Pence'}, SGD:{major:'Singapore Dollars', minor:'Cents'}
};
function amountInWords(amount, currency){
  const names = CURRENCY_WORDS[currency] || CURRENCY_WORDS.INR;
  const n = Math.abs(Number(amount)||0);
  const major = Math.floor(n);
  const minor = Math.round((n - major) * 100);
  let out = names.major + ' ' + integerToIndianWords(major);
  if(minor > 0) out += ' and ' + twoDigitWords(minor) + ' ' + names.minor;
  return out + ' Only';
}
function rupeesInWords(amount){ return amountInWords(amount, 'INR'); }
function toast(msg, isErr){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div'); t.className = 'toast'+(isErr?' err':''); t.textContent = msg;
  wrap.appendChild(t); setTimeout(()=>t.remove(), 3200);
}
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  const hist = (emp.salaryHistory||[]).slice().sort((a,b)=> a.effectiveFrom.localeCompare(b.effectiveFrom));

      designation: fd.get('designation').trim(), department: fd.get('department').trim(),
      grade: fd.get('grade').trim(), location: fd.get('location').trim(), division: fd.get('division').trim(),
      doj: fd.get('doj'), dob: fd.get('dob'), gender: fd.get('gender'),
      phone: fd.get('phone').trim(), email: fd.get('email').trim(), address: fd.get('address').trim(),
      pan: fd.get('pan').trim().toUpperCase(), aadhaar: fd.get('aadhaar').trim(), uan: fd.get('uan').trim(),
      pfNumber: fd.get('pfNumber').trim(), esicNo: fd.get('esicNo').trim(),
      tdsReportCodeOverride: fd.get('tdsReportCodeOverride').trim(),
      bankName: fd.get('bankName').trim(), bankAccNo: fd.get('bankAccNo').trim(), ifsc: fd.get('ifsc').trim().toUpperCase(),
      salaryHistory: e.salaryHistory
    };
    if(isEdit) updated._rev = e._rev;
    tagRecord(updated, !isEdit);
    if(isEdit){
      const idx = EMPLOYEES.findIndex(x=>x.id===e.id); EMPLOYEES[idx] = updated;
    } else {
      updated.salaryHistory = [{
        id: uid(), effectiveFrom: (updated.doj||new Date().toISOString().slice(0,10)).slice(0,7),
        ...readSalaryFields(fd), revisedAt: new Date().toISOString(), reason:'Initial structure'
      }];
      EMPLOYEES.push(updated);
      ORG.employeeSeq = (ORG.employeeSeq||1) + 1;
      await saveOrg();
    }
    await saveEmployees();
    closeModal(); toast(isEdit?'Employee updated.':'Employee added.'); render();
}

/* ============================= CTC-DRIVEN SALARY STRUCTURING ============================= */
/* Given a single CTC figure, derives the full monthly breakdown per Settings → CTC Structuring
   Policy: Basic = basicPct × CTC; HRA = 50% of Basic; Children Education is a fixed monthly
   amount; LTA = Basic ÷ 12; PF Employee & PF Employer are each 12% of Basic (respecting the
   EPF wage ceiling if enabled); Professional Tax follows the configured slabs; Other Allowance
   is the balancing figure so everything reconciles exactly back to the CTC entered. PT depends
   on gross and gross depends on PT, so this iterates a couple of times to converge (it always
   does — PT only takes a handful of discrete values). */
function deriveFromCTC(ctc, reimbursement){
  const pol = ORG.ctcPolicy;
  const basic = ctc * pol.basicPct;
  const hra = basic * 0.5;
  const childrenEducation = pol.childrenEducation;
  const lta = basic / 12;
  const basicForPf = ORG.applyPfCeiling ? Math.min(basic, ORG.pfCeiling||15000) : basic;
  const pfEmployee = Math.round(basicForPf*0.12);
  const pfEmployer = pfEmployee;
  // CTC = Gross + PF Employer + Reimbursement — confirmed against two independent real
  // payslip/working examples. PF Employee and PT are deductions FROM Gross on the payslip,
  // not additive components of CTC, so they're deliberately excluded here.
  const gross = ctc - pfEmployer - reimbursement;
  const otherAllowance = gross - basic - hra - childrenEducation - lta;
  const pt = ptFor(gross); // informational here — the payslip itself computes PT off actual monthly gross
  return { basic, hra, childrenEducation, lta, otherAllowance, pfEmployee, pfEmployer, pt, reimbursement, gross,
    ctcCheck: gross+pfEmployer+reimbursement };
}

/* ============================= TAX / STATUTORY ENGINE ============================= */
/* period is 'YYYY-MM'. If an annual PT cap is configured (e.g. Maharashtra's ₹2,500), the
   normal monthly slab amount is topped up in February so the year totals exactly the cap —
   the standard 200×11+300=2500 pattern — instead of just multiplying the monthly slab by 12. */
function ptFor(gross, period){
  const slab = (ORG.ptSlabs||[]).find(s => gross>=s.min && gross<=s.max);
  let amt = slab ? slab.amount : 0;
  const cap = Number(ORG.ptAnnualCap)||0;
  if(cap>0 && amt>0 && period){
    const month = Number(String(period).slice(5,7));
    if(month===2) amt = Math.max(amt, cap - amt*11);
  }
  return amt;
}
/* The actual annual Professional Tax figure to deduct from Old Regime taxable income (u/s
   16(iii) — PT actually paid is deductible from salary income, separate from 80C/80D). If an
   annual cap applies and PT is payable at all, the year always nets to exactly that cap by
   construction of the February top-up rule; otherwise it's just 12× the flat monthly slab. */
function ptAnnualForTaxDeduction(gross){
  const monthly = ptFor(gross);
  const cap = Number(ORG.ptAnnualCap)||0;
  if(cap>0 && monthly>0) return cap;
  return monthly*12;
}

function surchargeRateFor(taxableAnnual, tiers){
  let rate = 0;
  (tiers||[]).slice().sort((a,b)=>a[0]-b[0]).forEach(([threshold,r])=>{ if(taxableAnnual>threshold) rate = r; });
  return rate;
}
/* Generic slab-tax computer, driven entirely by ORG.taxNew / ORG.taxOld — see Settings →
   Income Tax Rules. Editing those there re-shapes this calculation with no code change,
   for when a future Budget revises slabs, rebate thresholds, cess, or surcharge tiers. */
function regimeAnnualTax(taxableAnnual, rules){
  if(taxableAnnual<=(rules.rebateThreshold||0)) return {tax:0,surcharge:0,cess:0,total:0};
  let tax=0, prev=0;
  (rules.slabs||[]).forEach(([cap,rate])=>{
    const capVal = (cap===null||cap===undefined) ? Infinity : Number(cap);
    if(taxableAnnual>prev){ tax += (Math.min(taxableAnnual,capVal)-prev)*rate; prev=capVal; }
  });
  const surcharge = tax*surchargeRateFor(taxableAnnual, rules.surcharge);
  const cess = (tax+surcharge)*(rules.cess!=null?rules.cess:0.04);
  return {tax,surcharge,cess,total:tax+surcharge+cess};
}
function newRegimeAnnualTax(taxableAnnual){ return regimeAnnualTax(taxableAnnual, ORG.taxNew); }
function oldRegimeAnnualTax(taxableAnnual){ return regimeAnnualTax(taxableAnnual, ORG.taxOld); }
function hraExemptionAnnual(s){
  if(s.taxRegime!=='old') return 0;
  const hraAnnual = (s.hra||0)*12, basicAnnual=(s.basic||0)*12, rent=s.rentPaidAnnual||0;
  const byRule = Math.max(0, rent - 0.10*basicAnnual);
  const byCity = (s.metroCity?0.5:0.4)*basicAnnual;
  return Math.max(0, Math.min(hraAnnual, byRule, byCity));
}
/* Computes tax on an annual taxable-income figure for a salary structure's chosen regime,
   applying the same deductions/exemptions computePayslip uses. Shared by the regular and
   bonus-inclusive calculations below so both go through identical logic. */
function annualTaxFor(s, grossAnnual){
  let taxableAnnual, total;
  if(s.taxRegime==='old'){
    const hraEx = hraExemptionAnnual(s);
    const cap80C = Math.min(s.declared80C||0, 150000);
    const ptAnnual = ptAnnualForTaxDeduction(grossOf(s));
    taxableAnnual = Math.max(0, grossAnnual - (ORG.taxOld.stdDeduction||50000) - hraEx - cap80C - (s.declared80D||0) - (s.otherExemptions||0) - ptAnnual);
    total = oldRegimeAnnualTax(taxableAnnual).total;
  } else {
    taxableAnnual = Math.max(0, grossAnnual - (ORG.taxNew.stdDeduction||75000));
    total = newRegimeAnnualTax(taxableAnnual).total;
  }
  return { taxableAnnual, total };
}
/* Ex-gratia / one-time bonus TDS, and TDS generally: uses a cumulative true-up method (see
   computePayslip below), not the simpler "flat annual/12, plus a one-off bonus adjustment"
   approach this used to use. That older approach had a real gap — if a mid-year bonus pushed
   annual income into a higher surcharge band (e.g. crossing ₹1cr, 10%→15%), only the bonus
   month reflected it; every later month silently kept using the stale pre-bonus rate. The
   cumulative method self-corrects every month from actual YTD income (including bonuses
   already paid) plus projected remaining months, so a surcharge-band change carries forward
   automatically. Bonus is treated as fully taxable, excluded from PF/ESI wages (not "basic
   wages") but included in the month's gross for Professional Tax slab lookup, since PT is
   normally assessed on the month's total salary paid. Review against your state's PT rules
   and company bonus policy — reasonable default, not a statutory guarantee. */
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
/* Returns the 12 'YYYY-MM' strings of the April-March fiscal year that `period` falls in. */
function fyMonthsList(period){
  const [y,m] = period.split('-').map(Number);
  const fyStartYear = m>=4 ? y : y-1;
  const months = [];
  for(let i=0;i<12;i++){
    let mm = 4+i, yy = fyStartYear;
    if(mm>12){ mm-=12; yy+=1; }
    months.push(yy+'-'+String(mm).padStart(2,'0'));
  }
  return months;
}
/* One payslip per period for this employee — if a period was ever regenerated without
   deleting the original, this keeps only the most recently generated one, so the cumulative
   TDS calculation (which looks at "actual income and TDS already recorded this FY") never
   double-counts a duplicate. */
function dedupedPayslipsFor(empId, periods){
  const byPeriod = {};
  PAYSLIPS.filter(p=> p.empId===empId && periods.includes(p.period)).forEach(p=>{
    const existing = byPeriod[p.period];
    if(!existing || new Date(p.generatedAt||0) > new Date(existing.generatedAt||0)) byPeriod[p.period] = p;
  });
  return Object.values(byPeriod);
}
function computePayslip(emp, period, recurringAddition, lumpSum, lumpSumRateOverride){
  recurringAddition = Number(recurringAddition)||0;
  lumpSum = Number(lumpSum)||0;
  const bonus = recurringAddition + lumpSum; // combined figure, for PF/ESI/PT/display purposes
  const s = latestSalaryFor(emp, period);
  const gross = grossOf(s);
  const isContractor = s.taxRegime==='contractor';
  const pfOn = !isContractor || s.contractorPfApplicable;
  const esiOn = !isContractor || s.contractorEsiApplicable;
  const basicForPf = ORG.applyPfCeiling ? Math.min(s.basic, ORG.pfCeiling||15000) : s.basic;
  const pfEmployee = pfOn ? round2(basicForPf*0.12) : 0;
  const pfEmployer = pfEmployee; // mirrored, standard practice; bonus excluded from PF wages
  const esi = (esiOn && gross<=21000) ? round2(gross*0.0075) : 0; // bonus excluded from ESI wages; threshold always applies regardless of the toggle
  const grossWithBonus = gross + bonus;
  const pt = ptFor(grossWithBonus, period);

  let tds, appliedFlatRate = null, lumpSumTds = 0, taxableAnnual = 0, lumpSumRateUsed = null;
  if(isContractor){
    // Section 194C: a flat % of what's actually paid this month — no annualisation, no
    // slabs, no standard deduction/80C/HRA. Bonus (if any) is just added to the same base.
    const rate = (s.contractorTdsRate!=null ? s.contractorTdsRate : 1)/100;
    tds = round2(grossWithBonus*rate);
  } else if(lumpSum > 0){
    // One-time lump sum (e.g. a large ex-gratia): apply a flat, company-configured rate
    // directly to the lump sum itself — deducted entirely this month — then recompute the
    // flat "% of gross" rate needed to collect exactly the remaining balance of this
    // employee's correct full-year tax liability across this month's own regular pay and
    // every month left in the FY. Any smaller recurring addition (paid alongside this) is
    // folded into "gross" for that recomputed rate, not given the lump-sum treatment.
    const lumpSumRate = lumpSumRateOverride!=null ? Number(lumpSumRateOverride) : (Number(ORG.lumpSumBonusRate)||0.3588);
    lumpSumRateUsed = lumpSumRate;
    lumpSumTds = round2(lumpSum*lumpSumRate);
    const fyMonths = fyMonthsList(period);
    const idx = fyMonths.indexOf(period);
    const monthsRemainingInclusive = idx>=0 ? (12-idx) : 12;
    const priorPayslips = idx>=0 ? dedupedPayslipsFor(emp.id, fyMonths.slice(0,idx)) : [];
    const priorTdsDeducted = priorPayslips.reduce((sum,p)=> sum + (Number(p.tds)||0), 0);
    const priorLumpSums = priorPayslips.reduce((sum,p)=> sum + (Number(p.lumpSum)||0), 0);
    // Full-year projection (not cumulative actuals) — regular annual gross + this recurring
    // addition assumed for all 12 months + every lump sum paid this FY so far, including this
    // one. Must accumulate prior lump sums explicitly — a second lump-sum event later in the
    // year needs to still account for the first one's impact on the annual estimate, not just
    // its own amount.
    const totalAnnualEstimate = gross*12 + recurringAddition*12 + priorLumpSums + lumpSum;
    const totalAnnualCalc = annualTaxFor(s, totalAnnualEstimate);
    const totalAnnualTax = totalAnnualCalc.total;
    const remainingBalance = totalAnnualTax - priorTdsDeducted - lumpSumTds;
    const remainingGrossForRestOfYear = monthsRemainingInclusive*(gross+recurringAddition);
    appliedFlatRate = remainingGrossForRestOfYear>0 ? Math.max(0, remainingBalance/remainingGrossForRestOfYear) : 0;
    tds = round2(lumpSumTds + (gross+recurringAddition)*appliedFlatRate);
    taxableAnnual = totalAnnualCalc.taxableAnnual;
  } else {
    // Regular month, or one with only a smaller recurring addition: use whatever flat rate
    // is currently in force for this FY — the rate set by the most recent lump-sum event
    // this year, if any, otherwise the baseline rate implied by this employee's standard
    // annual tax ÷ standard annual gross (matches a steady month with no bonus history).
    const fyMonths = fyMonthsList(period);
    const idx = fyMonths.indexOf(period);
    const priorPayslips = idx>=0 ? dedupedPayslipsFor(emp.id, fyMonths.slice(0,idx)) : [];
    const lastLumpSumEvent = priorPayslips.slice().reverse().find(p=> p.appliedFlatRate!=null);
    if(lastLumpSumEvent){
      appliedFlatRate = lastLumpSumEvent.appliedFlatRate;
    } else {
      const baseline = annualTaxFor(s, gross*12);
      appliedFlatRate = gross>0 ? baseline.total/(gross*12) : 0;
      taxableAnnual = baseline.taxableAnnual;
    }
    tds = round2((gross+recurringAddition)*appliedFlatRate);
  }

  const totalDeductions = round2(pfEmployee+esi+pt+tds);
  const netPay = round2(gross+bonus-totalDeductions);
  const ctc = round2(gross+pfEmployer+(s.reimbursement||0));
  return {salarySnapshot:s, gross, bonus, recurringAddition, lumpSum, pfEmployee, pfEmployer, esi, pt, tds,
    appliedFlatRate, lumpSumTds, lumpSumRateUsed, totalDeductions, netPay, reimbursement:s.reimbursement||0, ctc, taxableAnnual};
}

  const byEmpPeriod = {};

      <div class="btn-row"><button class="btn danger sm" id="removeDupPayslipsBtn">Remove ${duplicateGroups.reduce((s,g)=>s+g.length-1,0)} Duplicate(s), Keep Most Recent</button></div>
    </div>` : ''}
    <div class="card">
      <h2>Issued Payslips</h2>
      <div class="grid cols-3" style="margin-bottom:10px;">
        <div class="field"><label>Search Staff Name</label><input type="text" id="pslipSearch" placeholder="Employee name..."></div>
        <div class="field"><label>Month</label><select id="pslipMonthFilter"><option value="">All Months</option>${months.map(m=>{ const label = new Date(2000,Number(m)-1,1).toLocaleString('en-IN',{month:'long'}); return `<option value="${m}">${label}</option>`; }).join('')}</select></div>
        <div class="field"><label>Year</label><select id="pslipYearFilter"><option value="">All Years</option>${years.map(y=>`<option value="${y}">${y}</option>`).join('')}</select></div>
      </div>
      <div id="payslipTableWrap"></div>
    </div>
    ${bonusSlips.length ? `
    <div class="card">
      <h2>Bonus &amp; TDS Impact Record</h2>
      <p style="color:var(--muted);font-size:13px;">Every month with a recurring addition and/or a one-time lump sum. "Applied Rate" is the flat % of gross in force that month; "Lump Sum TDS" is the flat-rate deduction taken directly on any one-time payment that month.</p>
      <table><thead><tr><th>Employee</th><th>Period</th><th class="num-cell">Recurring</th><th class="num-cell">Lump Sum</th><th class="num-cell">Applied Rate</th><th class="num-cell">Lump Sum Rate</th><th class="num-cell">Lump Sum TDS</th><th class="num-cell">Total TDS</th></tr></thead><tbody>
        ${bonusSlips.slice().reverse().map(p=>`
        <tr><td>${esc(p.empName)}</td><td>${esc(p.period)}</td><td class="num-cell">${money(p.recurringAddition||0)}</td><td class="num-cell">${money(p.lumpSum||0)}</td>
        <td class="num-cell">${p.appliedFlatRate!=null?(p.appliedFlatRate*100).toFixed(2)+'%':'—'}</td>
        <td class="num-cell">${p.lumpSumRateUsed!=null?(p.lumpSumRateUsed*100).toFixed(2)+'%':'—'}</td>
        <td class="num-cell" style="color:var(--accent);">${p.lumpSumTds?money(p.lumpSumTds):'—'}</td>
        <td class="num-cell"><b>${money(p.tds)}</b></td></tr>`).join('')}
      </tbody></table>
    </div>` : ''}
  `;
  function drawPayslipList(){
    const wrap = document.getElementById('payslipTableWrap');
    if(!PAYSLIPS.length){
      wrap.innerHTML = '<div class="empty"><div class="icon">🧾</div>No payslips generated yet.<div class="cta"><button class="btn" id="emptyGenBtn">+ Generate Payslip</button></div></div>';
      document.getElementById('emptyGenBtn').onclick = openGeneratePayslip; return;
    }
    const q = (document.getElementById('pslipSearch').value||'').toLowerCase();
    const month = document.getElementById('pslipMonthFilter').value;
    const year = document.getElementById('pslipYearFilter').value;
    const list = PAYSLIPS.filter(p=>{
      const mq = !q || (p.empName||'').toLowerCase().includes(q);
      const mm = !month || (p.period||'').slice(5,7)===month;
      const my = !year || (p.period||'').slice(0,4)===year;
      return mq && mm && my;
    });
    if(!list.length){ wrap.innerHTML = '<div class="empty">No payslips match this filter.</div>'; return; }
    wrap.innerHTML = `<table><thead><tr><th>Employee</th><th>Period</th><th class="num-cell">Gross</th><th class="num-cell">Deductions</th><th class="num-cell">Net Pay</th><th></th></tr></thead><tbody>
      ${list.slice().reverse().map(p=>`
        <tr><td>${esc(p.empName)}${p.bonus>0?' <span class="pill accent" title="Ex-gratia bonus paid this month">+ bonus</span>':''}</td><td>${esc(p.period)}</td><td class="num-cell">${money(p.gross+(p.bonus||0))}</td>
        <td class="num-cell">${money(p.totalDeductions)}</td><td class="num-cell"><b>${money(p.netPay)}</b></td>
        <td class="no-print" style="white-space:nowrap;">
          <button class="btn secondary sm" data-open="${p.id}">View / Print</button>
          <button class="btn secondary sm" data-editslip="${p.id}">✎ Edit</button>
          <button class="btn danger sm" data-delslip="${p.id}">🗑</button>
        </td></tr>`).join('')}
    </tbody></table>`;
    wrap.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPayslipView(b.dataset.open));
    wrap.querySelectorAll('[data-editslip]').forEach(b=>b.onclick=()=>openEditPayslip(b.dataset.editslip));
    wrap.querySelectorAll('[data-delslip]').forEach(b=>b.onclick=()=>deletePayslip(b.dataset.delslip));
  }
  if(PAYSLIPS.length){
    ['pslipSearch','pslipMonthFilter','pslipYearFilter'].forEach(id=> document.getElementById(id).addEventListener('input', drawPayslipList));
  }
  const removeDupBtn = document.getElementById('removeDupPayslipsBtn');
  if(removeDupBtn) removeDupBtn.onclick = async ()=>{
    if(!confirm(`This removes ${duplicateGroups.reduce((s,g)=>s+g.length-1,0)} older duplicate payslip(s), keeping only the most recently generated one per employee+period. This cannot be undone from here — proceed?`)) return;
    const idsToRemove = [];
    duplicateGroups.forEach(g=>{
      const sorted = g.slice().sort((a,b)=> new Date(b.generatedAt||0) - new Date(a.generatedAt||0));
      sorted.slice(1).forEach(p=> idsToRemove.push(p.id));
    });
    PAYSLIPS = PAYSLIPS.filter(p=> !idsToRemove.includes(p.id));
    idsToRemove.forEach(id=> recordTombstone('payslips', id));
    await savePayslips();
    toast(`Removed ${idsToRemove.length} duplicate payslip(s).`);
    render();
  };
  drawPayslipList();
}

/* ---- Edit a generated payslip (corrections) ---- */
function openEditPayslip(payslipId){
  const p = PAYSLIPS.find(x=>x.id===payslipId); if(!p) return;
  const baseRev = Number(p._rev)||0;
  const f = (label, key, val)=>`<div class="field"><label>${label}</label><input type="number" step="0.01" min="0" data-pf="${key}" value="${Number(val)||0}"></div>`;
  openModal(`
    <div class="modal-head"><h3>Edit Payslip — ${esc(p.empName)} (${esc(p.period)})</h3><button class="modal-close" id="mClose">✕</button></div>
    <p class="hint">Adjust the figures on this payslip for corrections. Gross, total deductions and net salary recalculate automatically. This edits <b>only this payslip</b> — it does not change the employee's salary structure.</p>
    <div class="section-label">Earnings</div>
    <div class="grid cols-3">
      ${f('Basic','basic',p.basic)}${f('HRA','hra',p.hra)}${f('Children Education','childrenEducation',p.childrenEducation)}
      ${f('Other Allowance','otherAllowance',p.otherAllowance)}${f('LTA','lta',p.lta)}${f('Recurring Addition','recurringAddition',p.recurringAddition||0)}
    </div>
    <div class="grid cols-3">${f('One-Time Lump Sum','lumpSum',p.lumpSum||0)}</div>
    <div class="section-label">Deductions</div>
    <div class="grid cols-3">
      ${f('Provident Fund','pfEmployee',p.pfEmployee)}${f('ESI','esi',p.esi)}${f('Professional Tax','pt',p.pt)}
      ${f('TDS (total, editable)','tds',p.tds)}
    </div>
    <p class="hint" style="margin:-4px 0 8px;">${p.appliedFlatRate!=null?`Applied rate when generated: ${(p.appliedFlatRate*100).toFixed(2)}%. `:''}${p.lumpSumTds?`Lump-sum TDS when generated: ${money2(p.lumpSumTds)}. `:''}Editing TDS here overrides the generated figure directly — it won't recompute from rate/lump-sum.</p>
    <div class="divider"></div>
    <div id="editSlipTotals" class="grid cols-3"></div>
    <div class="btn-row"><button class="btn" id="saveSlipEdit">Save Changes</button><button class="btn secondary" id="mCancel">Cancel</button></div>
  `, true);
  document.getElementById('mClose').onclick = closeModal; document.getElementById('mCancel').onclick = closeModal;
  const inputs = ()=> Array.from(document.querySelectorAll('[data-pf]'));
  function vals(){ const o={}; inputs().forEach(i=> o[i.dataset.pf] = Number(i.value)||0); return o; }
  function recalc(){
    const v = vals();
    const gross = v.basic + v.hra + v.childrenEducation + v.otherAllowance + v.lta;
    const bonus = v.recurringAddition + v.lumpSum;
    const tds = v.tds;
    const ded = v.pfEmployee + v.esi + v.pt + tds;
    document.getElementById('editSlipTotals').innerHTML =
      `<div><label>Gross Earning (incl. bonus)</label><div><b>${money2(gross+bonus)}</b></div></div>
       <div><label>Total Deduction (TDS: ${money2(tds)})</label><div><b>${money2(ded)}</b></div></div>
       <div><label>Net Salary</label><div><b>${money2(gross+bonus-ded)}</b></div></div>
       <div style="grid-column:1/-1;font-size:11px;color:var(--muted);font-style:italic;">${esc(rupeesInWords(gross+bonus-ded))}</div>`;
  }
  inputs().forEach(i=> i.addEventListener('input', recalc));
  recalc();
  document.getElementById('saveSlipEdit').onclick = async ()=>{
    const conflict = await checkRecordConflict('payslips', payslipId, baseRev);
    if(conflict){
      conflictWarning(conflict._updatedBy, conflict._updatedAt,
        ()=>{ const idx = PAYSLIPS.findIndex(x=>x.id===payslipId); if(idx>-1) PAYSLIPS[idx]=conflict; openEditPayslip(payslipId); },
        ()=> submitPayslipEdit(payslipId, vals()));
      return;
    }
    await submitPayslipEdit(payslipId, vals());
  };
}
async function submitPayslipEdit(payslipId, v){
    const p = PAYSLIPS.find(x=>x.id===payslipId); if(!p) return;
    Object.assign(p, v);
    p.bonus = v.recurringAddition + v.lumpSum;
    p.gross = v.basic + v.hra + v.childrenEducation + v.otherAllowance + v.lta;
    p.totalDeductions = v.pfEmployee + v.esi + v.pt + p.tds;
    p.netPay = p.gross + p.bonus - p.totalDeductions;
    tagRecord(p, false);
    await savePayslips(); closeModal(); toast('Payslip updated.'); render();
}

function deletePayslip(payslipId){
  const p = PAYSLIPS.find(x=>x.id===payslipId); if(!p) return;
  openModal(`
    <div class="modal-head"><h3>Delete Payslip</h3><button class="modal-close" id="mClose">✕</button></div>
    <p>Delete the payslip for <b>${esc(p.empName)}</b> for <b>${esc(p.period)}</b>? This cannot be undone.</p>
    <div class="btn-row"><button class="btn danger" id="confirmDelSlip">Delete</button><button class="btn secondary" id="mCancel">Cancel</button></div>
  `);
  document.getElementById('mClose').onclick = closeModal; document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('confirmDelSlip').onclick = async ()=>{
    PAYSLIPS = PAYSLIPS.filter(x=>x.id!==payslipId); recordTombstone('payslips', payslipId);
    await savePayslips(); closeModal(); toast('Payslip deleted.'); render();
  };
}

function openGeneratePayslip(){
  if(!EMPLOYEES.length){ toast('Add an employee first.', true); return; }
  const defaultPeriod = new Date().toISOString().slice(0,7);
  openModal(`
    <div class="modal-head"><h3>Generate Payslip</h3><button class="modal-close" id="mClose">✕</button></div>
    <div class="grid cols-2">
      <div class="field"><label>Employee</label><select id="genEmp">${EMPLOYEES.map(e=>`<option value="${e.id}">${esc(e.name)} (${esc(e.empCode)})</option>`).join('')}</select></div>
      <div class="field"><label>Period (Month)</label><input type="month" id="genPeriod" value="${defaultPeriod}"></div>
    </div>
    <div class="grid cols-2">
      <div class="field"><label>Recurring Monthly Addition (₹, optional)</label><input type="number" min="0" step="0.01" id="genRecurring" value="0"></div>
      <div class="field"><label>One-Time Lump Sum This Month (₹, optional)</label><input type="number" min="0" step="0.01" id="genLumpSum" value="0"></div>
    </div>
    <div class="field" id="genLumpSumRateWrap" style="display:none;max-width:260px;"><label>Lump-Sum TDS Rate % <span style="font-weight:400;color:var(--muted);">(override for this payslip only)</span></label><input type="number" min="0" max="100" step="0.01" id="genLumpSumRate" value="${(ORG.lumpSumBonusRate*100).toFixed(2)}"></div>
    <p class="hint" style="margin:-6px 0 8px;">Recurring addition (e.g. a monthly ex-gratia that continues every month) is folded into gross and taxed at the same rate as regular salary. A one-time lump sum (e.g. a large annual bonus) gets its own flat rate applied directly — defaults to the company rate in Settings, override it here if this specific payment should use a different one — then recalculates the rate for the rest of this FY.</p>
    <div id="genPreview"></div>
    <div class="btn-row"><button class="btn" id="genConfirm">Generate</button><button class="btn secondary" id="mCancel">Cancel</button></div>
  `);
  document.getElementById('mClose').onclick = closeModal; document.getElementById('mCancel').onclick = closeModal;
  function preview(){
    const emp = EMPLOYEES.find(x=>x.id===document.getElementById('genEmp').value); if(!emp) return;
    const recurring = Number(document.getElementById('genRecurring').value)||0;
    const lump = Number(document.getElementById('genLumpSum').value)||0;
    document.getElementById('genLumpSumRateWrap').style.display = lump>0 ? '' : 'none';
    const rateOverride = lump>0 ? (Number(document.getElementById('genLumpSumRate').value)||0)/100 : null;
    const r = computePayslip(emp, document.getElementById('genPeriod').value, recurring, lump, rateOverride);
    document.getElementById('genPreview').innerHTML = `
      <div class="divider"></div>
      <div class="grid cols-3">
        <div><label>Gross (regular)</label><div>${money(r.gross)}</div></div>
        <div><label>EPF (12% Basic)</label><div>${money(r.pfEmployee)}</div></div>
        <div><label>ESI (0.75%)</label><div>${r.esi?money(r.esi):'N/A'}</div></div>
        <div><label>Professional Tax</label><div>${money(r.pt)}</div></div>
        <div><label>Applied Rate on Regular Pay (${r.salarySnapshot.taxRegime==='old'?'Old':'New'} Regime)</label><div>${r.appliedFlatRate!=null?(r.appliedFlatRate*100).toFixed(2)+'%':'—'}</div></div>
        ${lump>0 ? `<div><label style="color:var(--accent);">Lump Sum TDS (at ${r.lumpSumRateUsed!=null?(r.lumpSumRateUsed*100).toFixed(2):'—'}%)</label><div style="color:var(--accent);"><b>${money(r.lumpSumTds)}</b></div></div>` : ''}
        <div><label>Total TDS this month</label><div><b>${money(r.tds)}</b></div></div>
        <div><label>Net Pay</label><div><b>${money(r.netPay)}</b></div></div>
      </div>
      ${lump>0 ? `<div class="hint" style="margin-top:6px;">The lump sum's own TDS (${money(r.lumpSumTds)}, at the rate set above) is deducted entirely this month. The remaining balance of this employee's correct full-year tax is then spread as a flat % of gross (shown above) across this month's own regular pay and every month left in this FY — carrying forward automatically until another lump sum or a new financial year resets it.</div>` : ''}`;
  }
  document.getElementById('genEmp').addEventListener('change', preview);
  document.getElementById('genPeriod').addEventListener('change', preview);
  document.getElementById('genRecurring').addEventListener('input', preview);
  document.getElementById('genLumpSum').addEventListener('input', preview);
  document.getElementById('genLumpSumRate').addEventListener('input', preview);
  preview();
  document.getElementById('genConfirm').onclick = async ()=>{
    const btn = document.getElementById('genConfirm');
    try{
      const emp = EMPLOYEES.find(x=>x.id===document.getElementById('genEmp').value);
      if(!emp) throw new Error('No employee selected.');
      const period = document.getElementById('genPeriod').value;
      const existing = PAYSLIPS.find(p=> p.empId===emp.id && p.period===period);
      if(existing && !confirm(`A payslip for ${emp.name} — ${period} already exists (Net Pay ${money(existing.netPay)}, generated ${new Date(existing.generatedAt).toLocaleDateString('en-IN')}).\n\nGenerating again will REPLACE it, not create a second copy — keeping a duplicate around would double-count this employee's salary in Tax Compliance and in next month's TDS calculation.\n\nContinue and replace it?`)) return;
      btn.disabled = true; btn.textContent = 'Generating…';
      const recurring = Number(document.getElementById('genRecurring').value)||0;
      const lump = Number(document.getElementById('genLumpSum').value)||0;
      const rateOverride = lump>0 ? (Number(document.getElementById('genLumpSumRate').value)||0)/100 : null;
      const r = computePayslip(emp, period, recurring, lump, rateOverride);
      const record = {
        id: existing?existing.id:uid(), empId:emp.id, empName:emp.name, empCode:emp.empCode, designation:emp.designation,
        department:emp.department, grade:emp.grade, location:emp.location, division:emp.division,
        pfNumber:emp.pfNumber, uan:emp.uan,
        dob:emp.dob, doj:emp.doj, pan:emp.pan,
        bankAccNo:emp.bankAccNo, bankName:emp.bankName, ifsc:emp.ifsc, period,
        basic:r.salarySnapshot.basic, hra:r.salarySnapshot.hra, childrenEducation:r.salarySnapshot.childrenEducation,
        otherAllowance:r.salarySnapshot.otherAllowance, lta:r.salarySnapshot.lta,
        gross:r.gross, bonus:r.bonus, recurringAddition:r.recurringAddition, lumpSum:r.lumpSum,
        pfEmployee:r.pfEmployee, pfEmployer:r.pfEmployer, esi:r.esi, pt:r.pt, tds:r.tds,
        appliedFlatRate:r.appliedFlatRate, lumpSumTds:r.lumpSumTds, lumpSumRateUsed:r.lumpSumRateUsed,
        totalDeductions:r.totalDeductions, netPay:r.netPay, reimbursement:r.reimbursement, ctc:r.ctc,
        taxRegime:r.salarySnapshot.taxRegime, taxableAnnual:r.taxableAnnual,
        generatedAt: new Date().toISOString()
      };
      tagRecord(record, !existing);
      if(existing){ Object.assign(existing, record); } else { PAYSLIPS.push(record); }
      const saved = await savePayslips();
      if(saved===false) throw new Error('Local save failed — browser storage may be full.');
      closeModal(); toast(existing?'Payslip replaced.':'Payslip generated and saved.'); render(); openPayslipView(record.id);
    }catch(err){
      btn.disabled = false; btn.textContent = 'Generate';
      toast('Could not save the payslip: '+(err.message||'unknown error')+' — nothing was recorded, please try again.', true);
    }
  };
}

function openPayslipView(payslipId){
  const p = PAYSLIPS.find(x=>x.id===payslipId); if(!p) return;
  const [y,m] = p.period.split('-');
  const monthName = new Date(Number(y),Number(m)-1,1).toLocaleString('en-IN',{month:'2-digit',year:'numeric'}).replace('/','/');
  const monthLong = new Date(Number(y),Number(m)-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'});
  const logoHtml = ORG.logo ? `<img src="${ORG.logo}">` : (ORG.companyName||'C').charAt(0).toUpperCase();
  /* Bank details as recorded on the staff record. Older payslips predate the bank snapshot,
     so fall back to the employee's current record where the snapshot is missing. */
  const emp = EMPLOYEES.find(x=>x.id===p.empId) || {};
  const bankName = p.bankName || emp.bankName || '';
  const bankAcc  = p.bankAccNo || emp.bankAccNo || '';
  const bankIfsc = p.ifsc || emp.ifsc || '';
  const bankLine = [bankName, bankAcc ? 'A/c '+bankAcc : '', bankIfsc ? 'IFSC '+bankIfsc : ''].filter(Boolean).join(', ');
  /* The visible document shows only regular-salary figures — any ex-gratia/lump-sum amount
     and its TDS are excluded entirely from what's displayed, on request, even though they're
     still correctly tracked in the stored record (p.tds/p.netPay) for compliance purposes —
     cumulative TDS calculation for future months, the Bonus & TDS Impact Record, and Sheet
     export all still see the true figures. Only this printed document itself is affected. */
  const dispGross = p.gross;
  const dispTds = p.taxRegime==='contractor'
    ? round2(p.gross * ((p.salarySnapshot && p.salarySnapshot.contractorTdsRate!=null ? p.salarySnapshot.contractorTdsRate : 1)/100))

  const dispTotalDeductions = round2((p.pfEmployee||0)+(p.esi||0)+(p.pt||0)+dispTds);

  const html = `

function readFileAsDataURL(file){

/* Used by every attachment upload flow (bills, receipts, Tally vouchers, documents,
   compliance files). Attachments only ever go to Drive now — no local-embed fallback — so a
   file added while Drive isn't connected is refused outright with a clear message, rather
   than silently landing back in localStorage the way the old fallback did. */
async function processAttachmentUpload(file){
  if(!driveConnected() || !ORG.gdrive || !ORG.gdrive.connected){
    throw new Error('Connect Google Drive (Settings) before adding attachments — they no longer save to this browser.');
  }
  const localFile = await readFileAsDataURL(file);
  return await driveUploadAttachmentFile(localFile);

/* Chrome blocks top-frame navigation straight to a data: URL (the "Not allowed to navigate
   top frame to data URL" console error) — a security measure against disguised-download
   phishing. blob: URLs aren't subject to that restriction, so every attachment view/download
   in the app converts through one on the way to window.open() or a download link, instead of
   using the raw data: URI directly. */
let _attachmentRegistry = {}, _attachmentRegistryId = 0;
function registerAttachment(f){
  const id = 'att'+(_attachmentRegistryId++);
  _attachmentRegistry[id] = f;
  return id;
}
function dataURLtoBlob(dataURL){
  const commaIdx = dataURL.indexOf(',');
  const header = dataURL.slice(0, commaIdx);
  const base64 = dataURL.slice(commaIdx+1);
  const mimeMatch = header.match(/data:([^;]+);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], {type: mime});
}
async function getAttachmentBlob(f){
  if(f.driveFileId) return await driveFetchAttachmentFile(f.driveFileId);
  if(f.data) return dataURLtoBlob(f.data);
  throw new Error('No file data available');
}
async function openAttachmentBlob(f){
  try{
    const blob = await getAttachmentBlob(f);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
  }catch(e){ toast('Could not open "'+f.name+'": '+e.message, true); }
}
async function downloadAttachmentBlob(f){
  try{
    const blob = await getAttachmentBlob(f);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = f.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 5000);
  }catch(e){ toast('Could not download "'+f.name+'": '+e.message, true); }
}
function openRegisteredAttachment(id){ const f = _attachmentRegistry[id]; if(f) openAttachmentBlob(f); }
function downloadRegisteredAttachment(id){ const f = _attachmentRegistry[id]; if(f) downloadAttachmentBlob(f); }

/* ============================= GOOGLE DRIVE SYNC ============================= */
/* Uses Google Identity Services (OAuth) + Drive API v3 + Sheets API v4 directly via fetch —
   no server needed, works fine from a static GitHub Pages site. Scope is drive.file, so the
   app can only see/edit the files and folders it creates itself, never your whole Drive. */
let gisTokenClient = null, driveAccessToken = null, driveTokenExpiry = 0, driveLastError = null, reconcilePending = false, driveDirty = true;
let driveSyncTimer = null, driveAutoInterval = null, driveBusy = false, driveReconnecting = false;

function driveConnected(){ return !!(driveAccessToken && Date.now() < driveTokenExpiry); }

function initGis(){
  if(gisTokenClient || !window.google || !google.accounts || !ORG.gdrive.clientId) return;
  gisTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: ORG.gdrive.clientId,
    scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets',
    callback: async (resp)=>{
      driveReconnecting = false;
      if(resp.error){
        if(resp.error!=='immediate_failed' && resp.error!=='popup_closed' && resp.error!=='popup_failed_to_open') toast('Google sign-in failed: '+resp.error, true);
        updateDriveStatusUI(); return;
      }
      driveAccessToken = resp.access_token;
      driveTokenExpiry = Date.now() + (Number(resp.expires_in||3500)-60)*1000;
      ORG.gdrive.connected = true; await saveOrg();
      toast('Google Drive connected.');
      ensureStaffName();
      try{ const waitingOnUser = await driveReconcileOnConnect(); if(!waitingOnUser) await driveSyncNow(); }catch(e){}
      startAutoSyncLoop(); startPresenceLoop();
      if(activeTab==='settings') renderSettings(document.getElementById('content'), document.getElementById('tabActions'));
    }
  });
}
function connectDrive(){
  if(!ORG.gdrive.clientId){ toast('Paste your Google OAuth Client ID first.', true); return; }
  initGis();
  if(!gisTokenClient){ toast('Google sign-in is still loading — try again in a moment.', true); return; }
  gisTokenClient.requestAccessToken({ prompt: driveAccessToken ? '' : 'consent' });
}
async function disconnectDrive(){
  driveAccessToken = null; driveTokenExpiry = 0;
  ORG.gdrive.connected = false; await saveOrg();
  if(driveAutoInterval){ clearInterval(driveAutoInterval); driveAutoInterval = null; }
  toast('Disconnected from Google Drive.');
  updateDriveStatusUI();
  if(activeTab==='settings') renderSettings(document.getElementById('content'), document.getElementById('tabActions'));
}
/* Called once on app load in every window/tab: if this browser previously connected Drive
   here, try to re-establish the session quietly (no popup) so sync "just works" without the
   person re-clicking Connect in each new window. If Google can't do it silently (no active
   Google session in this browser, or the browser blocks the silent attempt), it fails quietly
   and the Settings tab shows a Connect button as normal. */
function attemptSilentDriveReconnect(){
  if(!ORG.gdrive || !ORG.gdrive.connected || !ORG.gdrive.clientId) return;
  driveReconnecting = true;
  let tries = 0;
  const iv = setInterval(()=>{
    tries++;
    if(window.google && google.accounts && google.accounts.oauth2){
      clearInterval(iv);
      initGis();
      if(gisTokenClient) gisTokenClient.requestAccessToken({ prompt:'' });
      else driveReconnecting = false;
    } else if(tries > 24){ clearInterval(iv); driveReconnecting = false; }
  }, 250);
}
async function driveFetch(url, opts){
  opts = opts || {};
  if(!driveConnected()) throw new Error('Not connected to Google Drive');
  opts.headers = Object.assign({}, opts.headers, { Authorization: 'Bearer '+driveAccessToken });
  const res = await fetch(url, opts);
  if(res.status===401){ driveAccessToken=null; throw new Error('Google Drive session expired — reconnect in Settings'); }
  if(!res.ok){
    let detail = '';
    try{ const body = await res.clone().json(); detail = (body && body.error && body.error.message) || ''; }catch(e){}
    driveLastError = `${res.status}${detail?': '+detail:''}`;
    throw new Error(`Drive/Sheets request failed (${res.status})${detail?': '+detail:''}`);
  }
  return res;
}
async function driveFindOrCreateFolder(name, parentId){
  const parentClause = parentId ? ` and '${parentId}' in parents` : " and 'root' in parents";
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false${parentClause}`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length) return data.files[0].id;
  const body = { name, mimeType:'application/vnd.google-apps.folder' };
  body.parents = [parentId || 'root'];
  const cres = await driveFetch('https://www.googleapis.com/drive/v3/files', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const cdata = await cres.json();
  return cdata.id;
}
async function driveSetup(){
  if(ORG.gdrive.pinnedFolderId){
    ORG.gdrive.folderId = ORG.gdrive.pinnedFolderId;
    ORG.gdrive.backupsFolderId = await driveFindOrCreateFolder('Backups', ORG.gdrive.pinnedFolderId);
    await saveOrgSilent();
    return;
  }
  const rootId = await driveFindOrCreateFolder('Valles EASY EMS Data', null);
  ORG.gdrive.folderId = rootId;
  ORG.gdrive.backupsFolderId = await driveFindOrCreateFolder('Backups', rootId);
  await saveOrgSilent();
}
async function saveOrgSilent(){ ensureLocal(); LOCAL.org = ORG; try{ localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); }catch(e){} }
/* Attachments live as individual files in Drive (an "Attachments" subfolder), not embedded
   as base64 inside the main synced JSON — that's what was filling up localStorage, since
   every attachment was being duplicated into the one blob that lives in the browser. Local
   records now hold just a lightweight reference {driveFileId, name, type, size}; the actual
   bytes are fetched from Drive on demand when viewing/downloading. */
async function driveEnsureAttachmentsFolder(){
  if(ORG.gdrive.attachmentsFolderId) return ORG.gdrive.attachmentsFolderId;
  if(!ORG.gdrive.folderId) await driveSetup();
  ORG.gdrive.attachmentsFolderId = await driveFindOrCreateFolder('Attachments', ORG.gdrive.folderId);
  await saveOrgSilent();
  return ORG.gdrive.attachmentsFolderId;
}
async function driveUploadAttachmentFile(f){
  const folderId = await driveEnsureAttachmentsFolder();
  const blob = dataURLtoBlob(f.data);
  const metadata = { name: f.name, parents:[folderId] };
  const boundary = 'valles_att_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const metaPart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`;
  const mediaHeader = `--${boundary}\r\nContent-Type: ${f.type||'application/octet-stream'}\r\n\r\n`;
  const closeDelim = `\r\n--${boundary}--`;
  const body = new Blob([metaPart, mediaHeader, blob, closeDelim]);
  const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body
  });
  const result = await res.json();
  return { driveFileId: result.id, name:f.name, type:f.type, size:f.size };
}
async function driveFetchAttachmentFile(driveFileId){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`);
  return await res.blob();
}
/* Finds the existing live data.json by name within the Drive folder if this device doesn't
   already have its ID cached — same fix already applied to the Sheet lookup, applied here
   too. Without this, every fresh device that connects would create its OWN separate
   data.json instead of finding the one that already exists, silently diverging forever. */
async function driveEnsureDataFile(){
  if(ORG.gdrive.fileId) return ORG.gdrive.fileId;
  if(!ORG.gdrive.folderId) await driveSetup();
  try{
    const q = encodeURIComponent(`name='data.json' and mimeType='application/json' and trashed=false and '${ORG.gdrive.folderId}' in parents`);
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
    const data = await res.json();
    if(data.files && data.files.length){ ORG.gdrive.fileId = data.files[0].id; await saveOrgSilent(); }
  }catch(e){}
  return ORG.gdrive.fileId;
}
/* Pulls whatever's currently in Drive and merges it into local state using the same safe,
   non-destructive merge every save already uses (never blindly overwrites — newer wins per
   record, deletions apply via tombstones). Runs on every routine reconnect (every app open),
   so changes made on other devices actually show up here by default, not just when this
   device happens to save something itself. */
function pullLatestFromDriveIntoLocal(remote){
  if(!remote) return;
  EMPLOYEES = mergeCollection('employees', EMPLOYEES, remote.employees, remote.tombstones && remote.tombstones.employees);
  PAYSLIPS = mergeCollection('payslips', PAYSLIPS, remote.payslips, remote.tombstones && remote.tombstones.payslips);
  PARTIES = mergeCollection('parties', PARTIES, remote.parties, remote.tombstones && remote.tombstones.parties);
  COMPANY_DOCS = mergeCollection('documents', COMPANY_DOCS, remote.documents, remote.tombstones && remote.tombstones.documents);
  TRANSACTIONS = mergeCollection('transactions', TRANSACTIONS, remote.transactions, remote.tombstones && remote.tombstones.transactions);
  EXPENSES = mergeCollection('expenses', EXPENSES, remote.expenses, remote.tombstones && remote.tombstones.expenses);
  REIMBURSEMENTS = mergeCollection('reimbursements', REIMBURSEMENTS, remote.reimbursements, remote.tombstones && remote.tombstones.reimbursements);
  if(remote.compliance){
    Object.keys(remote.compliance).forEach(empId=>{
      const tombKind = 'compliance:'+empId;
      const remoteTomb = remote.tombstones ? remote.tombstones[tombKind] : null;
      COMPLIANCE[empId] = mergeCollection(tombKind, COMPLIANCE[empId]||[], remote.compliance[empId], remoteTomb);
    });
  }
  ensureLocal();
  LOCAL.employees = EMPLOYEES; LOCAL.payslips = PAYSLIPS; LOCAL.parties = PARTIES;
  LOCAL.documents = COMPANY_DOCS; LOCAL.transactions = TRANSACTIONS; LOCAL.expenses = EXPENSES; LOCAL.reimbursements = REIMBURSEMENTS; LOCAL.compliance = COMPLIANCE;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); }catch(e){}
  if(activeTab && document.getElementById('content')) render(); // reflect anything that changed
}
function totalRecordCount(payload){
  return (payload.employees||[]).length + (payload.payslips||[]).length + (payload.parties||[]).length +
    (payload.documents||[]).length + (payload.transactions||[]).length + (payload.expenses||[]).length;
}
/* Shared by every restore path (Drive backup restore, manual JSON restore, and first-connect
   auto-import) so they can never drift out of sync with each other. */
async function applyRestoredPayload(data){
  const gdriveKeep = ORG.gdrive;
  ORG = data.org || ORG; ORG.gdrive = gdriveKeep;
  backfillOrgDefaults();
  EMPLOYEES = data.employees||[]; PAYSLIPS = data.payslips||[]; COMPLIANCE = data.compliance||{};
  PARTIES = data.parties||[]; COMPANY_DOCS = data.documents||[]; TRANSACTIONS = data.transactions||[]; EXPENSES = data.expenses||[]; REIMBURSEMENTS = data.reimbursements||[];
  await saveOrg(); await saveEmployees(); await savePayslips(); await saveParties(); await saveCompanyDocs(); await saveTransactions(); await saveExpenses(); await saveReimbursements();
  for(const empId of Object.keys(COMPLIANCE)){ await saveCompliance(empId); }
  refreshBrand(); updateDocBadge();

/* The core of a workable multi-device setup: run once right after a device connects to
   Drive for the first time, BEFORE any push happens. Finds whatever's already in Drive and
   decides what to do based on what's on each side — rather than blindly pushing this
   device's state (which, for a fresh device, is empty, and would previously have created a
   confusing duplicate data.json instead of finding the real one). */
async function driveReconcileOnConnect(){
  const alreadyKnownDevice = !!ORG.gdrive.fileId; // this device has connected before and already knows its data file
  if(!ORG.gdrive.folderId) await driveSetup();
  await driveEnsureDataFile();
  if(!ORG.gdrive.fileId) return false; // nothing in Drive yet — genuinely first-ever setup, push local as-is
  let remote = null;
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${ORG.gdrive.fileId}?alt=media`);
    if(res.ok) remote = await res.json();
  }catch(e){}
  if(!remote) return false;
  if(alreadyKnownDevice){
    // Routine reconnect — this happens on every single app open/refresh, not just once, since
    // it shares the same callback as a fresh connect. Asking "which data wins" here (as this
    // function used to, unconditionally) meant that choice modal was popping up on every
    // normal reopen once a device had real data — not a genuine ambiguity, just noise. A
    // known device's local and remote data are the same lineage; merge them quietly the same
    // way every other save on this device already does, and load Drive's latest by default.
    pullLatestFromDriveIntoLocal(remote);
    return false;
  }
  const localCount = totalRecordCount({ employees:EMPLOYEES, payslips:PAYSLIPS, parties:PARTIES, documents:COMPANY_DOCS, transactions:TRANSACTIONS, expenses:EXPENSES });
  const remoteCount = totalRecordCount(remote);
  if(localCount===0 && remoteCount>0){
    await applyRestoredPayload(remote);
    toast(`Imported existing company data from Google Drive (${remoteCount} records) into this device.`);
    return false;
  } else if(localCount>0 && remoteCount>0){
    showReconcileChoiceModal(remote, localCount, remoteCount);
    return true; // blocking — caller must NOT auto-sync until the user picks an option
  }
  // localCount>0 && remoteCount===0, or both zero: nothing to reconcile — proceed normally.
  return false;
}
function showReconcileChoiceModal(remotePayload, localCount, remoteCount){

    <p>This device has <b>${localCount}</b> record(s) that have never synced, and Google Drive already has <b>${remoteCount}</b> record(s) saved from elsewhere. Pick how to proceed — auto-merging isn't safe here, since it isn't clear which side is current.</p>
    <div class="btn-row" style="flex-direction:column;align-items:stretch;gap:8px;">

async function driveUploadJson(name, parentId, contentObj, existingFileId){
  const metadata = { name, mimeType:'application/json' };
  if(!existingFileId && parentId) metadata.parents = [parentId];
  const boundary = 'valleseasyems_'+uid();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(contentObj)}\r\n` +
    `--${boundary}--`;
  const url = existingFileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${existingFileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const res = await driveFetch(url, { method: existingFileId?'PATCH':'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body });
  return res.json();
}
/* Change-triggered sync: fires a few seconds after the person edits something, so a save
   feels near-instant. The 20-second interval below is the backstop that runs regardless,
   so other open windows/tabs and any missed edits still land within 20s. */
function scheduleDriveSync(){
  if(!ORG || !ORG.gdrive || !ORG.gdrive.connected) return;
  clearTimeout(driveSyncTimer);

}
function startAutoSyncLoop(){

}
/* Multi-user presence: each device stamps its own staff name with the current time, synced
   alongside everything else. Other devices merge these in on every sync (own timestamp
   always wins for ourselves, so a stale remote value can't override a heartbeat we just
   sent). This is Drive-sync-based, not truly real-time — expect up to ~20-60s lag before
   someone shows as online or goes offline, not instant. */
function updatePresenceHeartbeat(){
  const name = currentStaffName();
  if(!name) return;
  ensureLocal();
  LOCAL.presence[name] = new Date().toISOString();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); }catch(e){}
}
function mergePresenceFrom(remotePresence){
  if(!remotePresence) return;
  ensureLocal();
  const mySelf = currentStaffName();
  Object.entries(remotePresence).forEach(([name,ts])=>{
    if(name===mySelf) return; // never let a stale remote value override our own fresh heartbeat
    if(!LOCAL.presence[name] || new Date(ts) > new Date(LOCAL.presence[name])) LOCAL.presence[name] = ts;
  });
  try{ localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); }catch(e){}
}
let presenceLoopStarted = false;
function startPresenceLoop(){
  if(presenceLoopStarted) return;
  presenceLoopStarted = true;
  updatePresenceHeartbeat();
  setInterval(()=>{
    updatePresenceHeartbeat();
    if(ORG.gdrive && ORG.gdrive.connected){ driveDirty = true; driveSyncNow(); }
    renderPresenceBadge();
  }, 60000);
}
function renderPresenceBadge(){
  const el = document.getElementById('navPresenceBadge');
  if(!el) return;
  ensureLocal();
  const now = Date.now();
  const mySelf = currentStaffName();
  const others = Object.entries(LOCAL.presence||{})
    .filter(([name,ts])=> name!==mySelf && (now-new Date(ts).getTime())<90000)
    .map(([name])=>name);
  el.innerHTML = others.length ? `<span class="pill accent" title="${esc(others.join(', '))}">🟢 ${others.length} other${others.length>1?'s':''} online</span>` : '';
}
async function driveSyncNow(){
  if(!driveConnected() || driveBusy || !ORG.gdrive.connected || reconcilePending) return;
  if(!driveDirty){ updateDriveStatusUI(); return; }
  driveBusy = true;
  try{
    if(!ORG.gdrive.folderId) await driveSetup();
    await driveEnsureDataFile();
    const remoteBefore = await pullRemotePayload();
    mergePresenceFrom(remoteBefore && remoteBefore.presence);
    const result = await driveUploadJson('data.json', ORG.gdrive.folderId, buildPayload(), ORG.gdrive.fileId);
    if(result && result.id){ ORG.gdrive.fileId = result.id; ORG.gdrive.lastSynced = new Date().toISOString(); driveLastError = null; await saveOrgSilent(); }
    try{ await driveExportSheet(true); driveLastError = null; }
    catch(e){ driveLastError = e.message; console.warn('Sheet sync failed:', e.message); }
    driveDirty = false;
  }catch(e){ driveLastError = e.message; console.warn('Drive sync failed:', e.message); }
  driveBusy = false;
  updateDriveStatusUI();
  renderPresenceBadge();
}
