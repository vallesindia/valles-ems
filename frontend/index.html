const SHEET_TABS = ['Employees','Salary History','Payslips','Compliance','Parties','Documents','Transactions','Expenses'];
async function driveEnsureSheet(){
  let sheetId = ORG.gdrive.pinnedSheetId || ORG.gdrive.sheetId;
  if(sheetId){
    // confirm it still exists / is reachable; a stale UN-pinned id falls through to search/recreate,
    // but a pinned id that's gone missing throws instead — pinning exists to guarantee determinism,
    // so silently creating a replacement (which would then be un-pinned) defeats the point.
    try{ const chk = await driveFetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?fields=spreadsheetId,sheets.properties.title`);
      if(!chk.ok){
        if(ORG.gdrive.pinnedSheetId) throw new Error('Pinned Google Sheet ID is not reachable — check it in Settings');
        sheetId = null;
      } else {
        const meta = await chk.json();
        const have = (meta.sheets||[]).map(s=>s.properties.title);
        const missing = SHEET_TABS.filter(t=>!have.includes(t));
        if(missing.length){
          await driveFetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}:batchUpdate`, { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ requests: missing.map(title=>({ addSheet:{ properties:{title} } })) }) });
        }
      }
    }catch(e){ if(ORG.gdrive.pinnedSheetId) throw e; sheetId = null; }
  }
  const sheetTitle = (ORG.companyName||'Valles Management System')+' — Live Data';
  if(!sheetId){
    /* This browser doesn't have a cached sheet ID — but another device may already have
       created the sheet. Search the shared Drive folder by name first (same pattern as the
       folder lookup) instead of assuming none exists, so every device converges on the same
       spreadsheet rather than each spawning its own duplicate. */
    if(!ORG.gdrive.folderId) await driveSetup();
    const q = encodeURIComponent(`name='${sheetTitle.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false and '${ORG.gdrive.folderId}' in parents`);
    const fres = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
    const fdata = await fres.json();
    if(fdata.files && fdata.files.length){
      sheetId = fdata.files[0].id;
      // an existing sheet found this way may predate newer tabs — ensure they're all present
      const chk2 = await driveFetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?fields=sheets.properties.title`);
      const meta2 = await chk2.json();
      const have2 = (meta2.sheets||[]).map(s=>s.properties.title);
      const missing2 = SHEET_TABS.filter(t=>!have2.includes(t));
      if(missing2.length){
        await driveFetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}:batchUpdate`, { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ requests: missing2.map(title=>({ addSheet:{ properties:{title} } })) }) });
      }
    }
  }
  if(!sheetId){
    const cres = await driveFetch('https://sheets.googleapis.com/v4/spreadsheets', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ properties:{title:sheetTitle}, sheets: SHEET_TABS.map(title=>({properties:{title}})) }) });
    const cdata = await cres.json();
    sheetId = cdata.spreadsheetId;
    if(!ORG.gdrive.folderId) await driveSetup();
    await driveFetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?addParents=${ORG.gdrive.folderId}&fields=id`, {method:'PATCH'});
  }
  if(sheetId !== ORG.gdrive.sheetId){ ORG.gdrive.sheetId = sheetId; await saveOrgSilent(); }
  return sheetId;
}
/* Converts a 1-based column number to its spreadsheet letter (27 -> AA, etc.) */
function colToLetter(n){
  let s = '';
  while(n > 0){ const rem = (n-1) % 26; s = String.fromCharCode(65+rem) + s; n = Math.floor((n-1)/26); }
  return s;
}

    { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({values:rows}) });

/* ============================= MULTI-STAFF SYNC SAFETY ============================= */
/* Since several people can have this app open at once on different machines, saves don't
   just overwrite Drive — they PULL the latest remote data first, MERGE it record-by-record
   with what's on this device (so a colleague's unrelated edits are never clobbered), and only
   then push. Records carry _rev/_updatedBy/_updatedAt so we can tell whose edit is newer. */
function currentStaffName(){ return (localStorage.getItem('vallesEasyEmsStaffName')||'').trim(); }
function setStaffName(n){ try{ localStorage.setItem('vallesEasyEmsStaffName', (n||'').trim()); }catch(e){} }
function ensureStaffName(){
  if(currentStaffName()) return;
  openModal(`
    <div class="modal-head"><h3>Who's using this device?</h3></div>
    <p class="hint">Since a few of you may be working on this at the same time, your name gets tagged on the changes you make — that's how the app knows whose edit is newest if two people touch the same record.</p>
    <div class="field"><label>Your Name</label><input type="text" id="staffNameInput" placeholder="e.g. Priya"></div>
    <div class="btn-row"><button class="btn" id="staffNameSave">Continue</button></div>
  `);
  document.getElementById('staffNameSave').onclick = ()=>{
    const v = document.getElementById('staffNameInput').value.trim();
    if(!v){ toast('Please enter a name.', true); return; }
    setStaffName(v); closeModal();
  };
}
function tagRecord(rec, isNew){
  rec._rev = isNew ? 1 : (Number(rec._rev)||0) + 1;
  rec._updatedBy = currentStaffName() || 'Unknown';
  rec._updatedAt = new Date().toISOString();
  return rec;
}
async function pullRemotePayload(){
  if(!driveConnected() || !ORG.gdrive.fileId) return null;
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${ORG.gdrive.fileId}?alt=media`);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
/* Merges a remote collection into the local one by id, and honours deletions: any id
   tombstoned on EITHER this device or the remote payload is dropped from the result, no
   matter which side still has a live copy of it — deletion always wins, matching the "this
   cannot be undone" the delete confirmation already promises. A colleague's newer edit
   (_rev) or brand-new record is otherwise adopted; anything the same or older stays as our
   in-memory copy (which may include the change we're about to save). */
function mergeCollection(tombKind, localArr, remoteArr, remoteTomb){
  ensureLocal();
  remoteArr = remoteArr || [];
  remoteTomb = remoteTomb || {};
  if(!LOCAL.tombstones[tombKind]) LOCAL.tombstones[tombKind] = {};
  const mergedTomb = Object.assign({}, remoteTomb, LOCAL.tombstones[tombKind]);
  LOCAL.tombstones[tombKind] = mergedTomb;
  let result = localArr.slice();
  remoteArr.forEach(r=>{
    if(mergedTomb[r.id]) return;
    const idx = result.findIndex(x=>x.id===r.id);
    if(idx===-1){ result.push(r); return; }
    const localRev = Number(result[idx]._rev)||0, remoteRev = Number(r._rev)||0;
    if(remoteRev > localRev) result[idx] = r;
  });
  result = result.filter(x=> !mergedTomb[x.id]);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); }catch(e){}
  return result;
}
/* Checks whether a specific record changed on Drive after `snapshotRev` (i.e. someone else
   saved a newer edit while this device had the record open in a form). Returns the newer
   remote record if so, otherwise null. Fails open (returns null) if Drive can't be reached
   right now, so editing still works offline. */
async function checkRecordConflict(listKey, id, snapshotRev){
  const remote = await pullRemotePayload();
  if(!remote) return null;
  const rec = (remote[listKey]||[]).find(x=>x.id===id);
  if(rec && (Number(rec._rev)||0) > snapshotRev) return rec;
  return null;
}
function conflictWarning(who, when, onDiscard, onOverwrite){
  openModal(`
    <div class="modal-head"><h3>⚠️ Someone Else Just Updated This</h3></div>
    <p><b>${esc(who||'A colleague')}</b> saved a change to this record at <b>${new Date(when).toLocaleTimeString('en-IN')}</b> — after you opened this form. Saving now would overwrite their update.</p>
    <div class="btn-row">
      <button class="btn" id="cwDiscard">Show Latest &amp; Re-edit</button>
      <button class="btn danger" id="cwOverwrite">Overwrite Anyway</button>
      <button class="btn secondary" id="mCancel">Cancel</button>
    </div>
  `, true);
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('cwDiscard').onclick = ()=>{ closeModal(); onDiscard && onDiscard(); };
  document.getElementById('cwOverwrite').onclick = ()=>{ closeModal(); onOverwrite && onOverwrite(); };
}

const DOC_CATEGORIES = ['Registration','Licence','Certificate','Insurance','Other'];
const INSURANCE_TYPES = ['WCC (Workmen Comp)','Group Medical','Personal & Accidental','Overseas Medical','Other'];
function docStatus(d){
  if(d.isLifetime || !d.expiryDate) return 'Lifetime';
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(d.expiryDate); exp.setHours(0,0,0,0);
  const daysLeft = Math.ceil((exp-today)/86400000);
  if(daysLeft<0) return 'Expired';
  if(daysLeft<=30) return 'Expiring';
  return 'Valid';
}
function docDaysToExpiry(d){
  if(d.isLifetime || !d.expiryDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(d.expiryDate); exp.setHours(0,0,0,0);
  return Math.ceil((exp-today)/86400000);
}

/* ============================= TRANSACTIONS ============================= */
/* Covers the full document lifecycle: Enquiry → Quotation → Purchase Order → Invoice →
   Credit Note, plus Delivery Note as its own track. Adapted from a larger reference ERP's
   Transactions module — scoped to the core workflow (party, line items with GST, status,
   numbering, locking, print) rather than every specialised field of the original (e.g. its
   exact per-category reference-type matrix and full revision-diff viewer are simplified
   here to a single reference field and a stored revision history). */
const TXN_CATEGORIES = {
  ENQUIRY:       { label:'Enquiry',           prefix:'ENQ',  statuses:['Draft','Sent','Approved','Completed'], lockDirection:'Outgoing' },
  QUOTATION:     { label:'Quotation',         prefix:'QUOT', statuses:['Draft','Sent','Approved','Completed'] },
  PO:            { label:'Purchase Order',    prefix:'PO',   statuses:['Draft','Sent','Approved','Completed'] },
  PROFORMA:      { label:'Proforma Invoice',  prefix:'PFI',  statuses:['Draft','Sent','Fund Received','Converted'] },
  INVOICE:       { label:'Invoice',           prefix:'INV',  statuses:['Draft','Sent','Approved','Completed','Paid'] },
  CREDIT_NOTE:   { label:'Credit Note',       prefix:'CN',   statuses:['Draft','Sent','Approved','Completed'] },
  DELIVERY_NOTE: { label:'Delivery Note',     prefix:'DN',   statuses:['Issued','Acknowledged','Invoiced'] }
};
const TXN_LOCKED_STATUSES = ['Completed','Paid','Invoiced','Converted'];
const TXN_REFERENCE_TYPES = ['Ref Email Dated','Ref Meeting Dated','Ref Enquiry Dated','Ref PO No','Ref Quotation No','Ref Proforma Invoice No','Ref Invoice No','Ref Work Order','Ref Indent No','Ref RFQ No'];
function txnIsLocked(t){ return TXN_LOCKED_STATUSES.includes(t.status) && !ORG.allowFinalisedTxnEdit; }
/* Indian financial year short-form: "2627" for FY2026-27 (Apr 2026 – Mar 2027). */
function currentFYShort(){
  const now = new Date(); const y = now.getFullYear(); const m = now.getMonth()+1;
  const startY = m>=4 ? y : y-1;
  return String(startY).slice(-2) + String(startY+1).slice(-2);
}
function nextTxnNo(category){
  const fy = currentFYShort();
  const key = category+'-'+fy;
  const prefix = (ORG.txnPrefixes && ORG.txnPrefixes[category]) || TXN_CATEGORIES[category].prefix;
  const stub = prefix+fy;
  // Next number = (highest number still in use for this category+FY) + 1 — so deleting a
  // record frees its number back up, rather than a counter that only ever climbs regardless
  // of what's been deleted. The Settings "Next Sequence Number" field still acts as a floor
  // if you ever want to deliberately skip ahead — it just no longer forces the number UP
  // after a deletion the way the old counter-only approach did.
  const existingNums = TRANSACTIONS
    .filter(t=> t.txnCategory===category && t.txnNo && t.txnNo.indexOf(stub)===0)
    .map(t=> parseInt(t.txnNo.slice(stub.length), 10))
    .filter(n=> !isNaN(n));
  const derivedNext = existingNums.length ? Math.max(...existingNums)+1 : 1;
  const seq = Math.max(derivedNext, ORG.txnSeq[key]||1);
  return `${stub}${String(seq).padStart(3,'0')}`;
}
/* Lets Cost/Unit accept a typed formula like Excel — "100*5", "(200+50)/2" — evaluated on
   leaving the field. Whitelists to digits/operators/parentheses/decimal points only before
   evaluating, so it can never run anything beyond basic arithmetic. Invalid input falls back
   to 0 rather than silently keeping something that looks like a formula but isn't one. */
function evalFormula(str){
  if(str==null) return 0;
  const expr = String(str).trim();
  if(expr==='') return 0;
  if(!/^[0-9+\-*/(). ]+$/.test(expr)) return NaN;
  try{
    const val = Function('"use strict"; return (' + expr + ')')();
    return (typeof val==='number' && isFinite(val)) ? val : NaN;
  }catch(e){ return NaN; }
}
function calcLineAmount(item){
  const base = (Number(item.qty)||0) * (Number(item.rate)||0);
  const discPct = Number(item.discountPct)||0;
  return base * (1 - discPct/100);
}
function calcTxnTotals(txn){
  const rate = Number(txn.exchRate)||1;
  const subtotal = (txn.items||[]).reduce((s,i)=> s+calcLineAmount(i), 0);
  let cgst=0, sgst=0, igst=0;
  (txn.items||[]).forEach(i=>{
    const tax = calcLineAmount(i) * (Number(i.gstPct)||0) / 100;
    if(txn.gstMode==='Inter') igst += tax;
    else if(txn.gstMode==='Intra'){ cgst += tax/2; sgst += tax/2; }
  });
  const taxAmount = cgst+sgst+igst;
  const grandTotal = subtotal+taxAmount;
  return { subtotal, cgst, sgst, igst, taxAmount, grandTotal,
    subtotalINR: subtotal*rate, taxAmountINR: taxAmount*rate, grandTotalINR: grandTotal*rate };
}
function txnStatusPill(status){
  const cls = {Draft:'neutral',Sent:'accent',Approved:'good',Completed:'good',Paid:'good',Issued:'accent',Acknowledged:'good',Invoiced:'good'}[status]||'neutral';
  return `<span class="pill ${cls}">${esc(status)}</span>`;
}

async function submitTxnForm(ev, isEdit, t){
  const fd = new FormData(ev.target);
  const party = PARTIES.find(p=>p.id===fd.get('partyId'));
  const items = txnLineItems.filter(li=> li.description.trim() || Number(li.qty) || Number(li.rate));
  const rec = {
    id: t.id||uid(), txnCategory: fd.get('txnCategory'), txnDirection: fd.get('txnDirection'),
    partyId: fd.get('partyId'), partyName: party?party.partyName:'',
    txnDate: fd.get('txnDate'), dueDate: fd.get('dueDate'),
    referenceType: fd.get('referenceType'), reference: fd.get('reference').trim(), subject: fd.get('subject').trim(),
    status: fd.get('status'), gstMode: fd.get('gstMode'), tdsDeductedByClient: Number(fd.get('tdsDeductedByClient'))||0,
    currency: fd.get('currency')||'INR', exchRate: Number(fd.get('exchRate'))||1,
    poNumber: fd.get('poNumber')||'', poDate: fd.get('poDate')||'', poTerms: fd.get('poTerms')||'',
    panNumber: fd.get('panNumber')||'', supplyDateTime: fd.get('supplyDateTime')||'', placeOfSupply: fd.get('placeOfSupply')||'', vehicleNo: fd.get('vehicleNo')||'',
    dnTransportMode: fd.get('dnTransportMode')||'', dnVehicleNo: fd.get('dnVehicleNo')||'', dnPlaceOfDelivery: fd.get('dnPlaceOfDelivery')||'',
    dnType: fd.get('dnType')||'', dnLinkedInvoice: fd.get('dnLinkedInvoice')||'', dnSignedStatus: fd.get('dnSignedStatus')||'', dnDeliveryDateTime: fd.get('dnDeliveryDateTime')||'',
    fundReceivedAmount: fd.get('fundReceivedAmount')!==null ? (Number(fd.get('fundReceivedAmount'))||0) : (t.fundReceivedAmount||''),
    fundReceivedDate: fd.get('fundReceivedDate')||t.fundReceivedDate||'', fundReceivedVia: (fd.get('fundReceivedVia')||t.fundReceivedVia||'').trim(),
    linkedInvoice: t.linkedInvoice||'', linkedProforma: t.linkedProforma||'',
    linkedInvoiceGST: t.linkedInvoiceGST||'', linkedInvoiceNonGST: t.linkedInvoiceNonGST||'', linkedProformas: t.linkedProformas||[],
    terms: fd.get('terms').trim(), notes: fd.get('notes').trim(), items,
    revisionNo: t.revisionNo||0, revisionHistory: t.revisionHistory||[]
  };
  if(isEdit){
    rec._rev = t._rev; rec.txnNo = t.txnNo;
    const markRevision = document.getElementById('txnMarkRevision') && document.getElementById('txnMarkRevision').checked;
    if(markRevision){
      // Keep a lightweight audit trail: snapshot the prior version before applying the new one.
      rec.revisionHistory = (t.revisionHistory||[]).concat([{ snapshotAt:new Date().toISOString(), by:currentStaffName(), status:t.status, items:t.items, terms:t.terms }]);
      rec.revisionNo = (t.revisionNo||0)+1;
    }
    // else: plain correction — revisionNo/revisionHistory carry over unchanged (already set
    // above from t.revisionNo/t.revisionHistory), no new snapshot, no Rev bump.
  } else {
    rec.txnNo = nextTxnNo(rec.txnCategory);
    await saveOrg();
  }
  tagRecord(rec, !isEdit);
  if(isEdit){ const idx = TRANSACTIONS.findIndex(x=>x.id===t.id); TRANSACTIONS[idx]=rec; } else { TRANSACTIONS.push(rec); }
  // Converting a Proforma Invoice: once the resulting Invoice is actually saved (and so has
  // its real txnNo), link back to the source PI and lock it — it's been converted, so further
  // edits to the proforma itself no longer make sense.
  if(!isEdit && rec.linkedProforma){
    const pi = TRANSACTIONS.find(x=> x.txnCategory==='PROFORMA' && x.txnNo===rec.linkedProforma);
    if(pi){ pi.linkedInvoice = rec.txnNo; pi.status = 'Converted'; tagRecord(pi, false); }
  }
  await saveTransactions();
  const savedAsRevision = isEdit && rec.revisionNo > (t.revisionNo||0);
  closeModal(); toast(isEdit ? (savedAsRevision ? `Saved as Rev-${rec.revisionNo}.` : 'Transaction updated.') : `${rec.txnNo} created.`); render();
}
/* Starts a new Invoice pre-filled from a Proforma Invoice's party, items, and terms, once
   funds have actually come in. Doesn't try to auto-reconcile the amount if the fund received
   differs from the original proforma (bank charges, partial payment, forex, etc. all need a
   human to look at) — instead it opens the normal edit form, pre-filled, so the figures can
   be adjusted to match what was actually received before it's saved as the final invoice. */
function convertToInvoice(piId){
  const pi = TRANSACTIONS.find(x=>x.id===piId); if(!pi) return;
  if(pi.linkedInvoice){ toast(`Already converted to Invoice ${pi.linkedInvoice}.`, true); return; }
  if(pi.linkedInvoiceGST || pi.linkedInvoiceNonGST){ toast(`Already consolidated into ${pi.linkedInvoiceGST||''} (GST) / ${pi.linkedInvoiceNonGST||''} (Non-GST).`, true); return; }
  openModal(`
    <div class="modal-head"><h3>Convert to Invoice</h3><button class="modal-close" id="mClose">✕</button></div>
    <p>This opens a new Invoice pre-filled from <b>${esc(pi.txnNo)}</b> (${esc(pi.partyName)}). Review and adjust the amounts to match what was actually received${pi.fundReceivedAmount?` (recorded: ${money2(Number(pi.fundReceivedAmount))})`:''} before saving — the proforma will then lock as converted.</p>
    <div class="btn-row"><button class="btn" id="confirmConvert">Continue to Invoice</button><button class="btn secondary" id="mCancel">Cancel</button></div>
  `);
  document.getElementById('mClose').onclick = closeModal; document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('confirmConvert').onclick = ()=>{
    closeModal();
    openTxnForm(null, {
      txnCategory:'INVOICE', txnDirection: pi.txnDirection, partyId: pi.partyId, txnDate:new Date().toISOString().slice(0,10),
      dueDate:'', referenceType:'Ref Proforma Invoice No', reference: pi.txnNo, subject: pi.subject,
      status:'Draft', gstMode: pi.gstMode, items: JSON.parse(JSON.stringify(pi.items||[])),
      terms: pi.terms, notes: `Converted from ${pi.txnNo}.${pi.fundReceivedAmount?` Fund received: ${money2(Number(pi.fundReceivedAmount))}${pi.fundReceivedDate?' on '+pi.fundReceivedDate:''}${pi.fundReceivedVia?' via '+pi.fundReceivedVia:''}.`:''}`,
      linkedProforma: pi.txnNo
    });
  };
}
let consolidateVesselRows = [];
function blankVesselRow(){ return { name:'', count:1, domesticDays:0, rate:0 }; }
/* ---- Situation 1: pure Export Invoice (every vessel outside India all month) ----
   Validated against the company's "GST and non-GST invoice working template" (5/5/26):
   1. Technical Service — one line per vessel: (days in month) × rate/day ($105). Since every
      vessel is outside India the whole month, ALL days are export days — no domestic split.
   2. Other Service — a single figure the company decides each month (NOT computed; varies
      month to month, e.g. $18,500 in the reference sheet).
   3. Additional Service — the true remainder: Total Proforma Amount − Technical Service Total
      − Other Service. Absorbs whatever's left, so the invoice always reconciles exactly to
      the month's total proforma amount.
   Reconciled exactly against the reference sheet's own numbers before shipping. */
let exportInvoiceVesselRows = [];
function blankExportVesselRow(){ return { name:'', count:1, rate:105 }; }
function calcExportInvoice(monthDays, vessels, piTotal, otherService){
  let technicalTotal = 0;
  const perVessel = vessels.map(v=>{
    const count = Number(v.count)||0, rate = Number(v.rate)||0;
    const amount = monthDays*count*rate;
    technicalTotal += amount;
    return { ...v, days:monthDays, amount };
  });
  const additionalService = piTotal - technicalTotal - otherService;
  return { perVessel, technicalTotal, otherService, additionalService, grandTotal: technicalTotal+otherService+additionalService };
}
function calcMixedInvoice(monthDays, vessels, piTotal, otherService){
  let totalExportTech = 0, totalDomesticTechTaxable = 0, totalDomesticTechInvoice = 0;
  const perVessel = vessels.map(v=>{
    const count = Number(v.count)||0, domesticDays = Number(v.domesticDays)||0, rate = Number(v.rate)||0;
    const exportDays = Math.max(0, monthDays - domesticDays);
    const exportTech = exportDays*count*rate;
    const domesticTechTaxable = domesticDays>0 ? domesticDays*count*rate : 0;
    const domesticTechGst = domesticTechTaxable*0.18;
    totalExportTech += exportTech;
    totalDomesticTechTaxable += domesticTechTaxable;
    totalDomesticTechInvoice += domesticTechTaxable+domesticTechGst;
    return { ...v, exportDays, domesticDays, exportTech, domesticTechTaxable, domesticTechGst, domesticTechInvoice: domesticTechTaxable+domesticTechGst };
  });
  const totalOtherServicesCost = piTotal - totalExportTech - totalDomesticTechInvoice;
  const additionalServiceCostPool = totalOtherServicesCost - otherService;
  const otherServiceTaxableBase = otherService/1.18;
  const additionalServiceTaxableBase = additionalServiceCostPool/1.18;
  const perDayOtherRate = monthDays>0 ? otherServiceTaxableBase/12/monthDays : 0;
  const perDayAdditionalRate = monthDays>0 ? additionalServiceTaxableBase/12/monthDays : 0;
  let totalDomesticOtherTaxable=0, totalDomesticOtherInvoice=0, totalDomesticAdditionalTaxable=0, totalDomesticAdditionalInvoice=0;
  perVessel.forEach(v=>{
    const domesticOtherTaxable = v.domesticDays>0 ? perDayOtherRate*v.domesticDays : 0;
    const domesticAdditionalTaxable = v.domesticDays>0 ? perDayAdditionalRate*v.domesticDays : 0;
    v.domesticOtherTaxable = domesticOtherTaxable; v.domesticOtherGst = domesticOtherTaxable*0.18; v.domesticOtherInvoice = domesticOtherTaxable*1.18;
    v.domesticAdditionalTaxable = domesticAdditionalTaxable; v.domesticAdditionalGst = domesticAdditionalTaxable*0.18; v.domesticAdditionalInvoice = domesticAdditionalTaxable*1.18;
    totalDomesticOtherTaxable += domesticOtherTaxable; totalDomesticOtherInvoice += v.domesticOtherInvoice;
    totalDomesticAdditionalTaxable += domesticAdditionalTaxable; totalDomesticAdditionalInvoice += v.domesticAdditionalInvoice;
  });
  const exportAdditionalService = piTotal - totalExportTech - totalDomesticTechInvoice - totalDomesticOtherInvoice - totalDomesticAdditionalInvoice - otherService;
  return {
    perVessel, totalExportTech, totalDomesticTechTaxable, totalDomesticTechInvoice,
    totalOtherServicesCost, otherService, additionalServiceCostPool,
    perDayOtherRate, perDayAdditionalRate,
    totalDomesticOtherTaxable, totalDomesticOtherInvoice, totalDomesticAdditionalTaxable, totalDomesticAdditionalInvoice,
    exportAdditionalService,
    nonGstInvoiceTotal: totalExportTech + otherService + exportAdditionalService,
    gstInvoiceTaxable: totalDomesticTechTaxable + totalDomesticOtherTaxable + totalDomesticAdditionalTaxable,
    gstInvoiceTotal: totalDomesticTechInvoice + totalDomesticOtherInvoice + totalDomesticAdditionalInvoice
  };
}

  function drawPreview(){
    const monthDays = Number(document.getElementById('eiMonthDays').value)||31;
    const piTotal = selectedPiTotal();
    const otherService = Number(document.getElementById('eiOtherService').value)||0;
    const calc = calcExportInvoice(monthDays, exportInvoiceVesselRows, piTotal, otherService);

      <div class="divider"></div>
      <div class="grid cols-3">

      </div>
      ${calc.additionalService<0 ? `<div class="hint" style="color:var(--bad);">⚠ Additional Service is negative — Technical + Other Service exceeds the selected PI total. Check the fleet, rates, or Other Service figure.</div>` : ''}

        if(!v.name.trim()) return;

      });
      if(calc.otherService>0) items.push({ description:'Other Services', hsn:'', qty:1, uom:'NOS', rate:calc.otherService, discountPct:0, gstPct:0 });

      const rec = {
        id:uid(), txnCategory:'INVOICE', txnDirection:'Outgoing', partyId: party?party.id:'', partyName: party?party.partyName:selectedPIs[0].partyName,

        revisionNo:0, revisionHistory:[]
      };
      rec.txnNo = nextTxnNo('INVOICE');
      tagRecord(rec, true);
      TRANSACTIONS.push(rec);
      selectedPIs.forEach(p=>{ p.linkedInvoice = rec.txnNo; p.status = 'Converted'; tagRecord(p, false); });
      const saved = await saveTransactions();
      if(saved===false) throw new Error('Local save failed — browser storage may be full.');
      closeModal(); toast(`${rec.txnNo} created — ${money2(calc.grandTotal)}.`); render();
    }catch(err){
      btn.disabled = false; btn.textContent = 'Create Export Invoice';
      toast('Could not create the invoice: '+(err.message||'unknown error'), true);
    }
  };

const REIMBURSEMENT_HEADS = ['Vehicle', 'Mobile', 'Travel', 'Food', 'Medical', 'Other'];

let reimbClaimFilter = { month:'', empId:'' };
function openReimbursementClaimsModal(){
  const months = [...new Set(REIMBURSEMENTS.map(r=>r.period).filter(Boolean))].sort().reverse();

  document.getElementById('reimbFilterEmp').onchange = (e)=>{ reimbClaimFilter.empId = e.target.value; drawReimbTable(); };
  document.getElementById('reimbAddBtn').onclick = async ()=>{
    const empId = document.getElementById('reimbNewEmp').value;
    if(!empId){ toast('Select an employee.', true); return; }
    const emp = EMPLOYEES.find(x=>x.id===empId);
    const claim = {
      id: uid(), period: document.getElementById('reimbNewMonth').value, empId, empName: emp.name,
      accountingHead: document.getElementById('reimbNewHead').value,
      amountClaimed: Number(document.getElementById('reimbNewAmount').value)||0,
      supportingProvided: document.getElementById('reimbNewSupporting').checked,
      amountPaid: document.getElementById('reimbNewPaid').value!=='' ? Number(document.getElementById('reimbNewPaid').value) : null
    };
    tagRecord(claim, true);
    REIMBURSEMENTS.push(claim);
    const saved = await saveReimbursements();
    if(saved===false){ toast('Could not save — local storage may be full.', true); return; }
    toast('Claim added.');
    document.getElementById('reimbNewAmount').value = 0; document.getElementById('reimbNewPaid').value = '';
    drawReimbTable();
  };
  function drawReimbTable(){
    const wrap = document.getElementById('reimbTableWrap');
    let list = REIMBURSEMENTS.filter(r=> (!reimbClaimFilter.month || r.period===reimbClaimFilter.month) && (!reimbClaimFilter.empId || r.empId===reimbClaimFilter.empId));
    list = list.slice().sort((a,b)=> (b.period||'').localeCompare(a.period||'') || (a.empName||'').localeCompare(b.empName||''));
    if(!list.length){ wrap.innerHTML = '<div class="empty">No reimbursement claims recorded yet.</div>'; return; }
    const totalClaimed = list.reduce((s,r)=> s+(Number(r.amountClaimed)||0), 0);
    const totalPaid = list.reduce((s,r)=> s+(Number(r.amountPaid)||0), 0);
    wrap.innerHTML = `<div style="overflow-x:auto;">
      <table><thead><tr><th>Month</th><th>Name</th><th>Accounting Head</th><th class="num-cell">Amount for the Supportings Given</th><th>Supportings Provided</th><th class="num-cell">Amount Paid</th><th></th></tr></thead><tbody>
        ${list.map(r=>{ const [y,m]=(r.period||'').split('-'); const monthLabel = y&&m ? new Date(Number(y),Number(m)-1,1).toLocaleString('en-IN',{month:'short',year:'numeric'}) : (r.period||'—'); return `
        <tr>
          <td>${esc(monthLabel)}</td>
          <td>${esc(r.empName||'—')}</td>
          <td>${esc(r.accountingHead||'—')}</td>
          <td class="num-cell">${money2(r.amountClaimed)}</td>
          <td>${r.supportingProvided?'<span class="pill good">YES</span>':'<span class="pill bad">NO</span>'}</td>
          <td class="num-cell">${r.amountPaid!=null?`<b>${money2(r.amountPaid)}</b>`:`<button type="button" class="btn secondary sm" data-markpaid="${r.id}">Mark Paid</button>`}</td>
          <td><button type="button" class="btn danger sm" data-delclaim="${r.id}">✕</button></td>
        </tr>`; }).join('')}
        <tr class="totrow"><td colspan="3"><b>TOTAL</b></td><td class="num-cell"><b>${money2(totalClaimed)}</b></td><td></td><td class="num-cell"><b>${money2(totalPaid)}</b></td><td></td></tr>
      </tbody></table>
      </div>`;
    wrap.querySelectorAll('[data-delclaim]').forEach(b=> b.onclick = async ()=>{
      REIMBURSEMENTS = REIMBURSEMENTS.filter(r=>r.id!==b.dataset.delclaim); recordTombstone('reimbursements', b.dataset.delclaim);
      await saveReimbursements(); drawReimbTable();
    });
    wrap.querySelectorAll('[data-markpaid]').forEach(b=> b.onclick = async ()=>{
      const r = REIMBURSEMENTS.find(x=>x.id===b.dataset.markpaid); if(!r) return;
      const val = prompt('Amount paid for this claim (₹):', r.amountClaimed);
      if(val===null) return;
      r.amountPaid = Number(val)||0; tagRecord(r, false);
      await saveReimbursements(); toast('Marked as paid.'); drawReimbTable();
    });
  }
  drawReimbTable();
}

    if(newVesselNames.length){ ORG.vessels = (ORG.vessels||[]).concat(newVesselNames); await saveOrg(); }
    const month = document.getElementById('consMonth').value;
    const piNumbers = selectedPIs.map(p=>p.txnNo);
    const party = PARTIES.find(p=>p.id===selectedPIs[0].partyId);

    // Technical Service is inherently day-and-vessel-driven, so it's broken out per vessel on
    // both invoices — that's what a real tax invoice needs for line-item-level GST
    // reconciliation, not one pooled figure across the whole fleet. Other and Additional
    // Service get the same per-vessel treatment on the GST side (where the day-based
    // allocation is real), but stay as single pooled lines on the Export side, since there
    // they're genuinely company-level figures (a manually-set monthly amount, and whatever's
    // left over) rather than something tied to any one vessel's days.
    const gstItems = [];
    calc.perVessel.forEach(v=>{
      if(v.domesticTechTaxable>0) gstItems.push({ id:uid(), description:`Technical Service Fee — ${v.name||'Vessel'} (${v.domesticDays} day(s) in Indian Waters)`, hsn:'', qty:1, rate:v.domesticTechTaxable, gstPct:18 });
    });
    calc.perVessel.forEach(v=>{
      if(v.domesticOtherTaxable>0) gstItems.push({ id:uid(), description:`Other Services — ${v.name||'Vessel'} (Indian Waters)`, hsn:'', qty:1, rate:v.domesticOtherTaxable, gstPct:18 });
    });
    calc.perVessel.forEach(v=>{
      if(v.domesticAdditionalTaxable>0) gstItems.push({ id:uid(), description:`Additional Services — ${v.name||'Vessel'} (Indian Waters)`, hsn:'', qty:1, rate:v.domesticAdditionalTaxable, gstPct:18 });
    });
    if(!gstItems.length) gstItems.push({ id:uid(), description:'No vessels had days in Indian Waters this month', hsn:'', qty:1, rate:0, gstPct:18 });

    const nonGstItems = [];
    calc.perVessel.forEach(v=>{
      if(v.exportTech>0) nonGstItems.push({ id:uid(), description:`Technical Service Fee — ${v.name||'Vessel'} (${v.exportDays} day(s), International Waters)`, hsn:'', qty:1, rate:v.exportTech, gstPct:0 });
    });
    nonGstItems.push({ id:uid(), description:'Other Services — Export (International Waters)', hsn:'', qty:1, rate:calc.otherService, gstPct:0 });
    nonGstItems.push({ id:uid(), description:'Additional Services — Export (International Waters)', hsn:'', qty:1, rate:calc.exportAdditionalService, gstPct:0 });
    const commonNotes = `Consolidated from Proforma Invoice(s): ${piNumbers.join(', ')} — ${month}.`;

    async function createInvoice(items, gstMode, label){
      const rec = {
        id: uid(), txnCategory:'INVOICE', txnDirection: selectedPIs[0].txnDirection||'Outgoing',
        partyId: selectedPIs[0].partyId, partyName: party?party.partyName:selectedPIs[0].partyName,
        txnDate: new Date().toISOString().slice(0,10), dueDate:'',
        referenceType:'Ref Proforma Invoice No', reference: piNumbers.join(', '), subject: `${label} — ${month}`,
        status:'Draft', gstMode, currency: selectedPIs[0].currency||'INR', exchRate: selectedPIs[0].exchRate||1, items,
        poNumber:'', poDate:'', poTerms:'', panNumber:'', supplyDateTime:'', placeOfSupply:'', vehicleNo:'',
        dnTransportMode:'', dnVehicleNo:'', dnPlaceOfDelivery:'', dnType:'', dnLinkedInvoice:'', dnSignedStatus:'', dnDeliveryDateTime:'',
        fundReceivedAmount:'', fundReceivedDate:'', fundReceivedVia:'', linkedInvoice:'',
        linkedProforma:'', linkedProformas: piNumbers,
        terms:'', notes: commonNotes, revisionNo:0, revisionHistory:[]
      };
      rec.txnNo = nextTxnNo('INVOICE');
      tagRecord(rec, true);
      TRANSACTIONS.push(rec);
      return rec;
    }
    const gstInvoice = await createInvoice(gstItems, 'Intra', 'GST Invoice (Domestic)');
    const nonGstInvoice = await createInvoice(nonGstItems, 'None', 'Non-GST Invoice (Export)');
    await saveOrg();

    selectedPIs.forEach(pi=>{
      pi.linkedInvoiceGST = gstInvoice.txnNo; pi.linkedInvoiceNonGST = nonGstInvoice.txnNo;
      pi.status = 'Converted'; tagRecord(pi, false);
    });
    await saveTransactions();
    closeModal(); toast(`Created ${gstInvoice.txnNo} (GST) and ${nonGstInvoice.txnNo} (Non-GST) from ${selectedIds.length} proforma(s).`); render();
  };

    // conversion link too — otherwise it stays permanently marked "Converted" and excluded
    // from every conversion tool's eligible list, with no way to regenerate it.
    if(t.txnCategory==='INVOICE'){
      TRANSACTIONS.forEach(pi=>{
        if(pi.txnCategory!=='PROFORMA') return;

        if(pi.linkedInvoice===t.txnNo){ pi.linkedInvoice=''; touched=true; }

        if(pi.linkedInvoiceNonGST===t.txnNo){ pi.linkedInvoiceNonGST=''; touched=true; }

          if(!pi.linkedInvoice && !pi.linkedInvoiceGST && !pi.linkedInvoiceNonGST) pi.status='Sent';
          tagRecord(pi, false);
        }
      });
    }
    TRANSACTIONS = TRANSACTIONS.filter(x=>x.id!==id); recordTombstone('transactions', id);
    await saveTransactions(); closeModal(); toast('Transaction deleted.'); render();
  };

/* ============================= BILLS & EXPENSES ============================= */
/* Scoped to the core vendor-bill workflow — a single bill amount, GST, TDS (using the real
   Income Tax TDS section catalog below), and payment tracking. Deliberately leaves out the
   reference app's Tally ERP voucher sync, multi-currency/exchange rate handling, Reverse
   Charge Mechanism, GSTR-2B claim-month overrides, and Chart-of-Accounts ledger linkage —
   those are real, substantial systems in their own right and weren't part of what was asked
   for here. Ask if any of those are needed later. */
const TDS_SECTIONS = [
  { id:'SALARY',  oldCode:'192',     newCode:'392',          description:'Salary / Ex-Gratia (recorded as a bill, not a payslip)', defaultRate:0 },
  { id:'EPF',     oldCode:'192A',    newCode:'392',          description:'EPF premature withdrawal',           defaultRate:10 },
  { id:'COM-IH',  oldCode:'194H',    newCode:'393(1) Sl 1',  description:'Commission / brokerage — Indiv/HUF',  defaultRate:5 },
  { id:'COM-OT',  oldCode:'194H',    newCode:'393(1) Sl 1',  description:'Commission / brokerage — Others',     defaultRate:5 },
  { id:'RENT-PM', oldCode:'194I(a)', newCode:'393(1) Sl 2',  description:'Rent — Plant / Machinery',            defaultRate:2 },
  { id:'RENT-LB', oldCode:'194I(b)', newCode:'393(1) Sl 2',  description:'Rent — Land / Building / Furniture',  defaultRate:10 },
  { id:'CON-IH',  oldCode:'194C',    newCode:'393(1) Sl 6',  description:'Contractor payments — Indiv/HUF',     defaultRate:1 },
  { id:'CON-OT',  oldCode:'194C',    newCode:'393(1) Sl 6',  description:'Contractor payments — Others',        defaultRate:2 },
  { id:'TECH',    oldCode:'194J(b)', newCode:'393(1) Sl 6',  description:'Technical services',                  defaultRate:2 },
  { id:'PROF',    oldCode:'194J(a)', newCode:'393(1) Sl 6',  description:'Professional fees',                   defaultRate:10 },
  { id:'PUR',     oldCode:'194Q',    newCode:'393(1) Sl 8',  description:'Purchase of goods (above 50L)',       defaultRate:0.1 },
  { id:'PERK',    oldCode:'194R',    newCode:'393(1) Sl 9',  description:'Business perquisites',                defaultRate:10 }
];
const TDS_SECTION_BY_ID = Object.fromEntries(TDS_SECTIONS.map(s=>[s.id,s]));
function tdsSectionLabel(s){ return `${s.oldCode} → ${s.newCode} · ${s.description} · ${s.defaultRate}%`; }
const EXPENSE_CATEGORIES = ['Materials','Services','Rent','Utilities','Transport','Telephone Expenses','Vehicle Allowance','Professional Fees','Statutory','Salary','Other'];
function nextExpNo(){
  const fy = currentFYShort();
  const key = 'EXP-'+fy;
  const stub = ORG.expPrefix+fy;
  const existingNums = EXPENSES
    .filter(e=> e.voucherNo && e.voucherNo.indexOf(stub)===0)
    .map(e=> parseInt(e.voucherNo.slice(stub.length), 10))
    .filter(n=> !isNaN(n));
  const derivedNext = existingNums.length ? Math.max(...existingNums)+1 : 1;
  const seq = Math.max(derivedNext, ORG.expSeq[key]||1);
  return `${stub}${String(seq).padStart(3,'0')}`;
}
const CURRENCY_SYMBOLS = { INR:'₹', USD:'$', EUR:'€', GBP:'£', SGD:'S$' };
const RCM_RATES = [0,5,12,18,28];
/* Multi-currency: billAmount is in the bill's own currency; exchRate converts it to INR,
   and every downstream figure (GST, TDS, totals) is computed on that INR base — matching
   how the source app's calcExpAmounts() works.
   Reverse Charge (RCM): when applicable, the vendor is NOT collecting GST — you pay them
   only the taxable amount, and separately self-assess and pay that GST straight to the
   government (with a matching Input Tax Credit). So unlike a normal bill, the GST here is
   tracked for compliance but does NOT add to what the vendor is owed. */
function calcExpenseTotals(e){
  const billType = e.billType || 'SUPPLIER';
  function payStatusFor(netPayable, paid){
    if(paid >= netPayable - 0.5) return 'Paid';
    if(paid > 0) return 'Partial';
    return 'Pending';
  }
  if(billType==='INTERBANK'){
    // A transfer between the company's own accounts settles itself — there's nothing
    // owed to anyone afterward, so it's always fully "paid" the moment it's recorded.
    const amt = Number(e.transferAmount)||0;
    return { amt, amtINR:amt, cgst:0, sgst:0, igst:0, gstTotal:0, tdsAmount:0, deductionsTotal:0,
      grossTotal:amt, netPayable:amt, balance:0, payStatus:'Paid' };
  }
  if(billType==='STATUTORY'){
    const amt = Number(e.statutoryAmount)||0;
    const balance = amt-(Number(e.paidAmount)||0); // negative = overpaid, kept visible rather than clamped to 0
    return { amt, amtINR:amt, cgst:0, sgst:0, igst:0, gstTotal:0, tdsAmount:0, deductionsTotal:0,
      grossTotal:amt, netPayable:amt, balance, payStatus:payStatusFor(amt, Number(e.paidAmount)||0) };
  }
  if(billType==='SALARY'){
    const amt = Number(e.statutoryAmount)||0;
    // Prefer the exact TDS amount when available (e.g. auto-filled from a payslip) over
    // recomputing from a rate — a rate is inherently a rounded approximation (stored to 4
    // decimal places) of amount÷gross, so reapplying rate×gross introduces a small precision
    // loss the original amount never had. Falls back to rate×amount when no exact figure is
    // on record (manual entry, or a rate the user deliberately typed in themselves).
    const tdsAmount = e.tdsApplicable ? (e.tdsFlatAmount!=null && e.tdsFlatAmount!=='' ? Number(e.tdsFlatAmount) : amt*(Number(e.tdsRate)||0)/100) : 0;
    const deductionsTotal = e.deductionsApplicable ? (Number(e.pfAmt)||0)+(Number(e.ptAmt)||0)+(Number(e.esicAmt)||0)+(Number(e.otherDeduction)||0) : 0;
    const netPayable = amt - tdsAmount - deductionsTotal;
    const balance = netPayable-(Number(e.paidAmount)||0); // negative = overpaid, kept visible rather than clamped to 0
    return { amt, amtINR:amt, cgst:0, sgst:0, igst:0, gstTotal:0, tdsAmount, deductionsTotal,
      grossTotal:amt, netPayable, balance, payStatus:payStatusFor(netPayable, Number(e.paidAmount)||0) };
  }
  // SUPPLIER (default/legacy records without a billType) — full GST/RCM/TDS/deductions.
  const rate = Number(e.exchRate)||1;
  const amt = Number(e.billAmount)||0;
  const amtINR = amt*rate;
  let cgst=0, sgst=0, igst=0;
  if(e.rcmApplicable){
    const r = Number(e.rcmRate)||0;
    if(e.rcmSupplyType==='inter') igst = amtINR*r/100;
    else { cgst = amtINR*r/200; sgst = amtINR*r/200; }
  } else {
    const gstAmt = amtINR * (Number(e.gstPct)||0) / 100;
    if(e.gstMode==='Inter') igst = gstAmt;
    else if(e.gstMode==='Intra'){ cgst = gstAmt/2; sgst = gstAmt/2; }
  }
  // A manual override — matching the vendor invoice's exact printed CGST/SGST/IGST — takes
  // precedence over the %-derived figure for that specific tax, so real-invoice rounding
  // never needs to be reverse-engineered from a percentage.
  if(e.cgstOverride!=null && e.cgstOverride!=='') cgst = Number(e.cgstOverride)||0;
  if(e.sgstOverride!=null && e.sgstOverride!=='') sgst = Number(e.sgstOverride)||0;
  if(e.igstOverride!=null && e.igstOverride!=='') igst = Number(e.igstOverride)||0;
  // GST amount is always rounded to the nearest rupee — under 50 paise rounds down, 50 paise
  // and above rounds up (standard GST invoice rounding). Each component rounds separately,
  // matching how a real tax invoice itemises CGST/SGST/IGST. Manual overrides are trusted
  // as-is (the point of entering one is to match an exact printed figure), not re-rounded.
  const hasOverride = (e.cgstOverride!=null && e.cgstOverride!=='') || (e.sgstOverride!=null && e.sgstOverride!=='') || (e.igstOverride!=null && e.igstOverride!=='');
  if(!hasOverride){ cgst = Math.round(cgst); sgst = Math.round(sgst); igst = Math.round(igst); }
  const gstTotal = cgst+sgst+igst;
  const tdsAmount = e.tdsApplicable ? amtINR * (Number(e.tdsRate)||0) / 100 : 0;
  const deductionsTotal = e.deductionsApplicable ? (Number(e.pfAmt)||0)+(Number(e.ptAmt)||0)+(Number(e.esicAmt)||0)+(Number(e.otherDeduction)||0) : 0;
  const creditNoteAmount = Number(e.creditNoteAmount)||0;
  const grossTotal = e.rcmApplicable ? amtINR : (amtINR + gstTotal);
  const netPayable = grossTotal - tdsAmount - deductionsTotal - creditNoteAmount;
  const balance = netPayable - (Number(e.paidAmount)||0); // negative = overpaid, kept visible rather than clamped to 0
  return { amt, amtINR, cgst, sgst, igst, gstTotal, tdsAmount, deductionsTotal, creditNoteAmount,
    grossTotal, netPayable, balance, payStatus:payStatusFor(netPayable, Number(e.paidAmount)||0) };
}
function expIsLocked(e){ return calcExpenseTotals(e).payStatus==='Paid' && !ORG.allowFinalisedExpenseEdit; }
function expStatusPill(status){
  const cls = {Pending:'bad', Partial:'warn', Paid:'good'}[status]||'neutral';
  return `<span class="pill ${cls}">${esc(status)}</span>`;
}

/* ============================= TAX COMPLIANCE ============================= */
let taxComplianceMonth = new Date().getMonth()+1;
let taxComplianceYear = new Date().getFullYear();
/* PF Liability: Admin Charges (0.5%) reuse whatever wage base the employee's own 12% PF
   contribution was actually computed on (capped or not, per Settings) — reverse-derived from
   the stored pfEmployee figure rather than re-deriving the cap logic separately. EDLI (0.5%)
   is always capped at ₹15,000 wages regardless of the employee's own PF cap setting — that's
   a fixed EPFO rule, not a company policy choice. */
function pfLiabilityData(year, month){
  const period = year+'-'+String(month).padStart(2,'0');
  const slips = PAYSLIPS.filter(p=> p.period===period && (p.pfEmployee>0 || p.pfEmployer>0));
  const rows = slips.map(p=>{
    const emp = EMPLOYEES.find(x=>x.id===p.empId);
    const pfBase = p.pfEmployee>0 ? round2(p.pfEmployee/0.12) : 0;
    const isCapped = pfBase>0 && pfBase < (p.basic||0) - 0.5;
    const admin = Math.round(pfBase*0.005);
    const edliBase = Math.min(p.basic||0, 15000);
    const edli = Math.round(edliBase*0.005);
    const total = round2((p.pfEmployee||0)+(p.pfEmployer||0)+admin+edli);
    return { empId:p.empId, name:p.empName||(emp?emp.name:'—'), type:(emp?emp.department:'')||'—', pfWages:p.basic||0,
      isCapped, pfEmployee:p.pfEmployee||0, pfEmployer:p.pfEmployer||0, admin, edli, edliCapped: edliBase<(p.basic||0)-0.5, total,
      uan:emp?emp.uan:'', pfNumber:emp?emp.pfNumber:'' };
  });
  const totals = rows.reduce((s,r)=>({ pfWages:s.pfWages+r.pfWages, pfEmployee:s.pfEmployee+r.pfEmployee, pfEmployer:s.pfEmployer+r.pfEmployer, admin:s.admin+r.admin, edli:s.edli+r.edli, total:s.total+r.total }),
    {pfWages:0, pfEmployee:0, pfEmployer:0, admin:0, edli:0, total:0});
  const deadlineYear = month===12 ? year+1 : year;
  const deadlineMonth = month===12 ? 1 : month+1;
  const deadline = new Date(deadlineYear, deadlineMonth-1, 15); // PF deposit deadline: 15th of next month
  return { period, rows, totals, deadline };
}
function taxComplianceData(year, month){
  const period = year+'-'+String(month).padStart(2,'0');
  const monthStart = period+'-01';
  const nextMonthDate = month===12 ? (year+1)+'-01-01' : year+'-'+String(month+1).padStart(2,'0')+'-01';
  // Assessment Year = the FY after the one this period falls in (Apr-Mar FY, AY is always FY+1)
  const fyStartYear = month>=4 ? year : year-1;
  const assessmentYear = `${fyStartYear+1}-${String((fyStartYear+2)%100).padStart(2,'0')}`;

  // TDS to Deposit — Salary (Section 192, from Payslips) + everything else (from Bills &
  // Expenses with TDS applicable), grouped by section for the breakdown, and also collected
  // as individual line items for the detailed report table.
  // Deduplicate by employee — if a payslip was ever regenerated without deleting the
  // original (e.g. before the duplicate-prevention check existed), keep only the most
  // recently generated one per employee for this period, so salary TDS isn't double-counted.
  const salarySlipsRaw = PAYSLIPS.filter(p=>p.period===period);
  const salarySlipsByEmp = {};
  salarySlipsRaw.forEach(p=>{
    const existing = salarySlipsByEmp[p.empId];
    if(!existing || new Date(p.generatedAt||0) > new Date(existing.generatedAt||0)) salarySlipsByEmp[p.empId] = p;
  });
  const salarySlips = Object.values(salarySlipsByEmp);
  const salaryTds = round2(salarySlips.reduce((s,p)=> s+(Number(p.tds)||0), 0));
  const bySection = {};
  const lineItems = [];
  if(salaryTds>0){
    bySection['SALARY'] = { label:'Salary', oldCode:'192', newCode:'392', amount:salaryTds, count:salarySlips.length, pending:salaryTds };
    salarySlips.forEach(p=>{
      const emp = EMPLOYEES.find(x=>x.id===p.empId);
      lineItems.push({
        billAttached:false, date:p.generatedAt?p.generatedAt.slice(0,10):(period+'-01'),
        companyName:p.empName, billAmount:(p.gross||0)+(p.bonus||0), tdsPct: p.gross ? round2((p.tds||0)/((p.gross||0)+(p.bonus||0))*100) : 0,
        tdsAmount:p.tds||0, tdsCode:'192 → 392', reportCode: (emp&&emp.tdsReportCodeOverride) || ORG.tdsReportCodes.SALARY||'392-1002', pan: emp?emp.pan:'', remark:'Salary — '+p.period, section:'SALARY'
      });
    });
  }
  // Salary payments are already counted above via Payslips (Section 192) — excluding
  // billType==='SALARY' here specifically, since a Salary-type Bills & Expenses record is
  // typically just tracking the same payment's bank transfer, not a separate TDS liability.
  // Counting it again here was double-counting every salary TDS amount in the report.
  EXPENSES.filter(e=> e.tdsApplicable && e.billType!=='SALARY' && e.billDate>=monthStart && e.billDate<nextMonthDate).forEach(e=>{
    const tot = calcExpenseTotals(e);
    const secId = e.tdsSectionId || 'OTHER';
    const secMeta = TDS_SECTION_BY_ID[secId];
    if(!bySection[secId]) bySection[secId] = { label: secMeta?secMeta.description:'Other', oldCode: secMeta?secMeta.oldCode:'—', newCode: secMeta?secMeta.newCode:'—', amount:0, count:0, pending:0 };
    bySection[secId].amount = round2(bySection[secId].amount + tot.tdsAmount);
    bySection[secId].count += 1;
    if(!e.tallyVoucherNo) bySection[secId].pending = round2(bySection[secId].pending + tot.tdsAmount);
    const vendor = PARTIES.find(p=>p.id===e.vendorId);
    lineItems.push({
      billAttached: (e.billAttachments||e.attachments||[]).length>0, date:e.billDate,
      companyName:e.vendorName||e.employeeName||'—', billAmount:tot.amtINR, tdsPct:Number(e.tdsRate)||0,
      tdsAmount:tot.tdsAmount, tdsCode: secMeta?`${secMeta.oldCode} → ${secMeta.newCode}`:'—',
      reportCode: ORG.tdsReportCodes[secId]||'—', pan: vendor?vendor.panNumber:'', remark:e.description||e.voucherNo, section:secId
    });
  });
  const totalTdsToDeposit = round2(Object.values(bySection).reduce((s,x)=> s+x.amount, 0));
  // Totals grouped by the actual filing report code (what the TDS Calculation report needs),
  // not the internal section id — several sections can legitimately share one report code.
  const totalsByReportCode = {};
  lineItems.forEach(li=>{ totalsByReportCode[li.reportCode] = round2((totalsByReportCode[li.reportCode]||0) + li.tdsAmount); });

  // No-TDS bills this period — for the "No TDS Table" section of the report.
  const noTdsItems = EXPENSES.filter(e=> !e.tdsApplicable && e.billDate>=monthStart && e.billDate<nextMonthDate).map(e=>({
    billAttached: (e.billAttachments||e.attachments||[]).length>0, date:e.billDate,
    companyName:e.vendorName||e.employeeName||'—', description:e.description||e.voucherNo,
    billAmount: calcExpenseTotals(e).amtINR, remark:e.voucherNo
  }));

  // TDS Receivable — from clients withholding TDS on Invoice transactions.
  const receivableTxns = TRANSACTIONS.filter(t=> t.txnCategory==='INVOICE' && t.txnDate>=monthStart && t.txnDate<nextMonthDate && Number(t.tdsDeductedByClient)>0);
  const tdsReceivable = round2(receivableTxns.reduce((s,t)=> s+Number(t.tdsDeductedByClient||0), 0));

  // GST Input Credit — from Bills & Expenses this month (includes RCM-self-assessed GST,
  // since that's also claimable as input credit once self-paid).
  const expensesThisMonth = EXPENSES.filter(e=> e.billDate>=monthStart && e.billDate<nextMonthDate);
  const gstInputExpenses = round2(expensesThisMonth.reduce((s,e)=> s+calcExpenseTotals(e).gstTotal, 0));

  // GST Output — from Invoice transactions this month.
  const invoiceTxns = TRANSACTIONS.filter(t=> t.txnCategory==='INVOICE' && t.txnDate>=monthStart && t.txnDate<nextMonthDate);
  const gstOutput = round2(invoiceTxns.reduce((s,t)=> s+calcTxnTotals(t).taxAmountINR, 0));
  const gstPayable = round2(gstOutput - gstInputExpenses);

  // TDS deposit deadline: 7th of the month AFTER the deduction month.
  const deadlineYear = month===12 ? year+1 : year;
  const deadlineMonth = month===12 ? 1 : month+1;
  const deadline = new Date(deadlineYear, deadlineMonth-1, 7);
  const today = new Date();
  const overdueDays = Math.floor((today - deadline) / 86400000);

  return { period, salaryTds, bySection, lineItems, totalsByReportCode, noTdsItems, assessmentYear, totalTdsToDeposit, tdsReceivable, receivableCount:receivableTxns.length,
    gstInputExpenses, expensesCount:expensesThisMonth.length, gstOutput, gstPayable, deadline, overdueDays };
}

async function generatePfPayableBill(pf, monthLong){
  if(EXPENSES.some(e=> e.billType==='STATUTORY' && e.statutoryType==='PF' && (e.billDate||'').slice(0,7)===pf.period)){
    toast('A PF payable bill already exists for this period — check Bills & Expenses.', true); return;
  }
  const rec = {
    id: uid(), billType:'STATUTORY', statutoryType:'PF', statutoryAmount: pf.totals.total,
    billDate: pf.period+'-01', dueDate: pf.deadline.toISOString().slice(0,10),
    description: `EPF contribution (Employee+Employer+Admin+EDLI) for ${monthLong}`,
    category:'Statutory', paidAmount:0, paymentMode:'', notes:`Auto-generated from Tax Compliance — ${pf.rows.length} staff.`
  };
  tagRecord(rec, true);
  rec.voucherNo = nextExpNo();
  EXPENSES.push(rec);
  const saved = await saveExpenses();
  if(saved===false){ toast('Could not save the PF bill — local storage may be full.', true); return; }
  toast(`PF Payable Bill ${rec.voucherNo} created for ${money(pf.totals.total)}.`);
  render();
}
function exportPfEcr(pf, monthLong){
  // Standard EPFO ECR text format: pipe-delimited, one row per employee —
  // UAN#~#Name#~#GrossWages#~#EPFWages#~#EPSWages#~#EDLIWages#~#EPFContribution#~#EPSContribution#~#EPFEPSDiff#~#NCPDays#~#RefundAdvance
  const lines = pf.rows.map(r=>{
    const epsWages = Math.min(r.pfWages, 15000);
    const epsContribution = round2(epsWages*0.0833); // 8.33% of the employer's 12% goes to EPS, capped at 15k wages
    const epfEpsDiff = round2(r.pfEmployer - epsContribution);
    return [r.uan||'', r.name, r.pfWages.toFixed(2), Math.min(r.pfWages,15000).toFixed(2), epsWages.toFixed(2), Math.min(r.pfWages,15000).toFixed(2),
      r.pfEmployee.toFixed(2), epsContribution.toFixed(2), epfEpsDiff.toFixed(2), '0', '0.00'].join('#~#');
  });
  const content = lines.join('\r\n');
  const blob = new Blob([content], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `ECR_${monthLong}_${taxComplianceYear}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 5000);
}

function exportTaxComplianceCsv(d, monthLong){
  const rows = [[`VALLES INDIA - TDS CALCULATION FOR ${monthLong.toUpperCase()} ${taxComplianceYear}`]];
  rows.push([`TAN No: ${ORG.tan||'—'}, Tax Applicable - ${ORG.taxApplicableCode}, Assessment Year ${d.assessmentYear}, Type of Payment - ${ORG.typeOfPayment}`]);
  rows.push([]);
  rows.push(['Bill Attached','Date','Company Name','Bill Amount','TDS%','TDS Amount','TDS Code','PAN No','Remarks']);
  d.lineItems.forEach(li=> rows.push([li.billAttached?'Yes':'No', li.date, li.companyName, li.billAmount, li.tdsPct, li.tdsAmount, li.reportCode, li.pan, li.remark]));
  rows.push([]);
  Object.entries(d.totalsByReportCode).forEach(([code,amt])=> rows.push([`Total ${code}`, '', '', '', '', amt]));
  rows.push(['Total TDS Calculation Amount', '', '', '', '', d.totalTdsToDeposit]);
  rows.push([]);
  rows.push([`VALLES INDIA - NO TDS TABLE FOR ${monthLong.toUpperCase()} ${taxComplianceYear}`]);
  rows.push(['Bill Attached','Date','Company Name','Description','Bill Amount','Remarks']);
  d.noTdsItems.forEach(li=> rows.push([li.billAttached?'Yes':'No', li.date, li.companyName, li.description, li.billAmount, li.remark]));
  rows.push([]);
  rows.push(['GST Output', '', '', '', d.gstOutput, '']);
  rows.push(['GST Input Credit', '', '', '', d.gstInputExpenses, '']);
  rows.push(['GST Payable', '', '', '', d.gstPayable, '']);
  const csv = rows.map(r=> r.map(v=> typeof v==='string' && (v.includes(',')||v.includes('"')) ? '"'+v.replace(/"/g,'""')+'"' : v).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `TaxCompliance_${monthLong}_${taxComplianceYear}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 5000);
}

  const BILL_TYPE_LABELS = { SUPPLIER:'Supplier', REIMBURSEMENT:'Reimbursement', STATUTORY:'Statutory', SALARY:'Salary', INTERBANK:'Inter-Bank' };
  function expPartyLabel(e){
    if(e.billType==='SALARY') return e.employeeName || '—';

    return e.vendorName || '—';

        </td>
        <td class="no-print" style="white-space:nowrap;">
          <button class="btn secondary sm" data-viewbillsummary="${e.id}">View</button>

        </td></tr>`; }).join('')}
    </tbody></table>`;
    wrap.querySelectorAll('[data-viewbillsummary]').forEach(b=> b.onclick=()=> openExpenseViewSummary(b.dataset.viewbillsummary));
    wrap.querySelectorAll('[data-viewbill]').forEach(b=> b.onclick=()=> viewAttachmentGroup(b.dataset.viewbill, 'bill'));

  }
  ['expSearch','expMonthFilter','expCatFilter','expStatusFilter'].forEach(id=> document.getElementById(id).addEventListener('input', draw));
  draw();
}
