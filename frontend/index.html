      </div>
      <p class="hint" style="margin:-4px 0 8px;">GST is calculated from the % above by default. To match a vendor invoice's exact printed figures instead, enter the amounts directly below — filling any of these overrides the % calculation for that tax.</p>
      <div class="grid cols-4">
        <div class="field" style="margin-bottom:0;"><label>Taxable Amount</label><input type="number" step="0.01" id="expTaxableDisplay" value="${e.billAmount}" disabled style="background:var(--bg);"></div>
        <div class="field" style="margin-bottom:0;"><label>Bill Amount in INR <span style="font-weight:400;color:var(--muted);">(auto)</span></label><input type="number" step="0.01" id="expAmtInrDisplay" disabled style="background:var(--bg);"></div>
        <div class="field" style="margin-bottom:0;"><label>CGST Amount <span style="font-weight:400;color:var(--muted);">(₹, optional override)</span></label><input type="number" min="0" step="0.01" name="cgstOverride" id="expCgstOverride" value="${e.cgstOverride!=null?e.cgstOverride:''}"></div>
        <div class="field" style="margin-bottom:0;"><label>SGST Amount <span style="font-weight:400;color:var(--muted);">(₹, optional override)</span></label><input type="number" min="0" step="0.01" name="sgstOverride" id="expSgstOverride" value="${e.sgstOverride!=null?e.sgstOverride:''}"></div>
      </div>
      <div class="grid cols-4" style="margin-top:8px;">
        <div class="field" style="margin-bottom:0;"><label>IGST Amount <span style="font-weight:400;color:var(--muted);">(₹, optional override)</span></label><input type="number" min="0" step="0.01" name="igstOverride" id="expIgstOverride" value="${e.igstOverride!=null?e.igstOverride:''}"></div>
        <div class="field" style="margin-bottom:0;"><label>Total Bill Amount <span style="font-weight:400;color:var(--muted);">(Taxable + GST, auto)</span></label><input type="number" step="0.01" id="expTotalBillDisplay" disabled style="background:var(--bg);"></div>
        <div class="field" style="margin-bottom:0;"><label>Credit Note / Discount <span style="font-weight:400;color:var(--muted);">(₹)</span></label><input type="number" min="0" step="0.01" name="creditNoteAmount" id="expCreditNote" value="${e.creditNoteAmount||0}"></div>
        <div class="field" style="margin-bottom:0;"><label>Credit Note / Discount Details</label><input type="text" name="creditNoteDetails" id="expCreditNoteDetails" value="${esc(e.creditNoteDetails)}" placeholder="Reference / description"></div>
      </div>
      <div class="field" style="background:#FFF7ED;border:1px solid #FDBA74;border-radius:8px;padding:10px 12px;margin-top:10px;">
        <label class="checkline"><input type="checkbox" name="rcmApplicable" id="expRcmChk" ${e.rcmApplicable?'checked':''}> 🔄 Reverse Charge (RCM) Applicable</label>
        <p class="hint" id="expRcmHelp" style="display:${e.rcmApplicable?'block':'none'};margin:6px 0 0;">Under RCM, <b>you</b> pay GST directly to the government (with matching Input Tax Credit) instead of the vendor collecting it — so the amount you pay the vendor excludes this GST.</p>
        <div class="grid cols-3" id="expRcmFields" style="display:${e.rcmApplicable?'grid':'none'};margin-top:8px;">
          <div class="field" style="margin-bottom:0;"><label>GST Rate</label><select name="rcmRate" id="expRcmRate">${RCM_RATES.map(r=>`<option value="${r}" ${e.rcmRate===r?'selected':''}>${r}%${r===18?' (most common)':''}</option>`).join('')}</select></div>
          <div class="field" style="margin-bottom:0;"><label>Supply Type</label><select name="rcmSupplyType" id="expRcmSupply"><option value="intra" ${e.rcmSupplyType==='intra'?'selected':''}>Intrastate (CGST+SGST)</option><option value="inter" ${e.rcmSupplyType==='inter'?'selected':''}>Interstate (IGST)</option></select></div>
        </div>
      </div>
      <div class="field"><label>GSTR-2B Claim Month <span style="font-weight:400;color:var(--muted);">(only if supplier files late — leave blank otherwise)</span></label><input type="month" name="gstr2bClaimMonth" value="${esc(e.gstr2bClaimMonth)}"></div>
      </div>
      <div class="section-label" id="expTdsSectionLabel">TDS</div>
      <div id="expTDSSection">
      <div class="field"><label class="checkline"><input type="checkbox" name="tdsApplicable" id="expTdsChk" ${e.tdsApplicable?'checked':''}> TDS applicable on this bill</label></div>
      <div class="grid cols-3" id="expTdsFields" style="display:${e.tdsApplicable?'grid':'none'};">
        <div class="field" style="grid-column:span 2;"><label>TDS Section</label><select name="tdsSectionId" id="expTdsSection">
          <option value="">— Select Section —</option>${TDS_SECTIONS.map(s=>`<option value="${s.id}" ${e.tdsSectionId===s.id?'selected':''}>${esc(tdsSectionLabel(s))}</option>`).join('')}
        </select></div>
        <div class="field"><label>TDS Rate %</label><input type="number" min="0" step="any" name="tdsRate" id="expTdsRate" value="${e.tdsRate}"></div>
        <input type="hidden" name="tdsFlatAmount" id="expTdsFlatAmount" value="${e.tdsFlatAmount!=null?e.tdsFlatAmount:''}">
        ${isEdit && e.billType==='SALARY' && e.tdsFlatAmount==null ? `<div class="field" style="grid-column:1/-1;"><div class="hint" style="color:var(--bad);margin-bottom:6px;">⚠ This bill predates a TDS-precision fix and may be showing a rounded figure, not the exact payslip amount.</div><button type="button" class="btn secondary sm" id="expRefreshTds">🔄 Refresh Exact TDS from Payslip</button></div>` : ''}
      </div>
      </div>
      <div id="expDeductionsSection" style="background:#FAF5FF;border:1px solid #E9D5FF;border-radius:8px;padding:10px 12px;margin:12px 0;">
        <label class="checkline"><input type="checkbox" name="deductionsApplicable" id="expDeductChk" ${e.deductionsApplicable?'checked':''}> Deductions Applicable (PF / PT / ESIC)</label>
        <div class="grid cols-4" id="expDeductFields" style="display:${e.deductionsApplicable?'grid':'none'};margin-top:8px;">
          <div class="field" style="margin-bottom:0;"><label>PF</label><input type="number" min="0" step="0.01" name="pfAmt" id="expPF" value="${e.pfAmt||0}"></div>
          <div class="field" style="margin-bottom:0;"><label>PT</label><input type="number" min="0" step="0.01" name="ptAmt" id="expPT" value="${e.ptAmt||0}"></div>
          <div class="field" style="margin-bottom:0;"><label>ESIC</label><input type="number" min="0" step="0.01" name="esicAmt" id="expESIC" value="${e.esicAmt||0}"></div>
          <div class="field" style="margin-bottom:0;"><label>Other</label><input type="number" min="0" step="0.01" name="otherDeduction" id="expOtherDed" value="${e.otherDeduction||0}"></div>
          <div class="field" style="grid-column:span 4;margin-bottom:0;"><label>Other Deduction Details</label><input type="text" name="otherDeductionDetails" value="${esc(e.otherDeductionDetails)}"></div>
        </div>
      </div>
      <div id="expTotalsPreview"></div>
      <div class="section-label" id="expPaymentLabel" style="margin-top:14px;">Payment</div>
      <div id="expAdvanceSection">
      <div class="grid cols-3">
        <div class="field"><label>Amount Paid So Far (₹)</label><input type="number" min="0" step="0.01" name="paidAmount" id="expPaidAmount" value="${e.paidAmount}"></div>
        <div class="field"><label>Payment Mode</label><select name="paymentMode" id="expPaymentMode">
          <option value="">— Not yet paid —</option>
          <option value="Bank Transfer" ${e.paymentMode==='Bank Transfer'?'selected':''}>Bank Transfer</option>
          <option value="Cheque" ${e.paymentMode==='Cheque'?'selected':''}>Cheque</option>
          <option value="Cash" ${e.paymentMode==='Cash'?'selected':''}>Cash</option>
          <option value="Card" ${e.paymentMode==='Card'?'selected':''}>Card</option>
          <option value="UPI" ${e.paymentMode==='UPI'?'selected':''}>UPI</option>
          <option value="Other" ${e.paymentMode==='Other'?'selected':''}>Other</option>
        </select></div>
      </div>
      <div id="expPaymentDetailFields"></div>
      </div>
      <div class="field"><label>Notes</label><textarea name="notes" rows="2">${esc(e.notes)}</textarea></div>
      <div class="section-label" style="display:flex;align-items:center;justify-content:space-between;">
        <span>📋 Tally Voucher</span>${e.tallyVoucherNo?'<span class="pill good">Posted</span>':'<span class="pill warn">Pending</span>'}
      </div>
      <p class="hint" style="margin:-4px 0 8px;">Record the Tally entry once your accountant has posted this bill — this is a tracking checklist, not an automatic sync.</p>
      <div class="grid cols-2">
        <div class="field"><label>Tally Voucher Number</label><input type="text" name="tallyVoucherNo" value="${esc(e.tallyVoucherNo)}"></div>
        <div class="field"><label>Tally Voucher Date</label><input type="date" name="tallyVoucherDate" value="${esc(e.tallyVoucherDate)}"></div>
      </div>
      <div class="file-drop" id="tallyDropZone">Click to attach a Tally voucher screenshot/export (optional)</div>
      <input type="file" id="tallyFileInput" style="display:none;">
      <div id="tallyFileChip"></div>
      <div class="section-label">Supporting Documents</div>
      <p class="hint" style="margin:-4px 0 8px;">Kept as two separate groups so it's easy to confirm at a glance whether both the bill and proof of payment are on file.</p>
      <div class="grid cols-2">
        <div>
          <label style="font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);">📄 Bill / Invoice Copy</label>
          <div class="file-drop" id="billDropZone" style="margin-top:6px;">Click to choose, or drag &amp; drop the vendor's bill</div>
          <input type="file" id="billFileInput" multiple style="display:none;">
          <div id="billFileChips"></div>
        </div>
        <div>
          <label style="font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);">🧾 Payment Receipt / Proof of Payment</label>
          <div class="file-drop" id="receiptDropZone" style="margin-top:6px;">Click to choose, or drag &amp; drop the payment receipt</div>
          <input type="file" id="receiptFileInput" multiple style="display:none;">
          <div id="receiptFileChips"></div>
        </div>
      </div>
      <div class="btn-row"><button type="submit" class="btn">Save Bill</button><button type="button" class="btn secondary" id="mCancel">Cancel</button></div>
    </form>
  `, true);
  document.getElementById('mClose').onclick = closeModal; document.getElementById('mCancel').onclick = closeModal;

  /* Drives which sections are visible/required based on Bill Type — mirrors the same pattern
     as the reference app: SUPPLIER (full GST/RCM/TDS/deductions), STATUTORY (a plain amount,
     nothing else), SALARY (amount + TDS + PF/PT/ESIC deductions), INTERBANK (just the
     transfer itself, no tax/payment tracking since the transfer settles immediately). */
  function currentBillType(){ return document.getElementById('expBillType') ? document.getElementById('expBillType').value : (e.billType||'SUPPLIER'); }
  function show(id, on){ const el=document.getElementById(id); if(el) el.style.display = on ? '' : 'none'; }
  function applyBillType(){
    const bt = currentBillType() || 'SUPPLIER';
    const isSupplierFamily = (bt==='SUPPLIER' || bt==='REIMBURSEMENT');
    show('expVendorWrap', bt!=='SALARY' && bt!=='INTERBANK');
    show('expEmployeeWrap', bt==='SALARY');
    show('expSalaryMonthWrap', bt==='SALARY');
    show('expStatutoryTypeWrap', bt==='STATUTORY');
    show('expDescriptionWrap', bt!=='INTERBANK');
    show('expCurrencyRow', isSupplierFamily);
    show('expSimpleAmountRow', bt==='STATUTORY' || bt==='SALARY');
    show('expInterBankWrap', bt==='INTERBANK');
    show('expGstSection', isSupplierFamily);
    show('expTDSSection', isSupplierFamily || bt==='SALARY');
    document.getElementById('expTdsSectionLabel').style.display = (isSupplierFamily||bt==='SALARY') ? '' : 'none';
    show('expDeductionsSection', isSupplierFamily || bt==='SALARY');
    show('expAdvanceSection', bt!=='INTERBANK');
    document.getElementById('expPaymentLabel').style.display = bt==='INTERBANK' ? 'none' : '';
    show('expDueDateWrap', bt!=='INTERBANK');

    const vendorLabel = document.getElementById('expVendorLabel');
    if(vendorLabel) vendorLabel.textContent = bt==='STATUTORY' ? 'Authority / Department' : 'Vendor';
    const statAmtLabel = document.getElementById('expStatutoryAmountLabel');
    if(statAmtLabel) statAmtLabel.textContent = bt==='SALARY' ? 'Salary / Wages Amount' : 'Amount';
    const billNoLabel = document.getElementById('expBillNoLabel');
    if(billNoLabel) billNoLabel.textContent = bt==='STATUTORY' ? 'Challan / Reference No' : bt==='SALARY' ? 'Payslip / Ref No' : bt==='INTERBANK' ? 'Transfer Ref / UTR No' : 'Bill No.';
    drawTotalsPreview();
  }
  const billTypeSel = document.getElementById('expBillType');
  if(!isEdit) billTypeSel.addEventListener('change', applyBillType);
  applyBillType();

  /* When a Salary/Wages bill has both employee and month selected, pull the actual figures
     from that employee's generated payslip for that month, if one exists — Gross becomes
     the bill's Amount, and TDS/PF/PT/ESIC are pre-filled so the expense reconciles exactly
     to what the payslip already paid out, instead of being retyped and risking a mismatch.
     If no payslip exists yet for that employee/month, this says so plainly and leaves the
     fields for manual entry rather than guessing. */
  function autofillFromPayslip(){
    if(currentBillType()!=='SALARY') return;
    const empId = document.getElementById('expEmployeeSel').value;
    const month = document.getElementById('expSalaryMonth').value;
    const banner = document.getElementById('expSalaryAutofillBanner');
    if(!empId || !month){ banner.innerHTML = ''; return; }
    const payslip = PAYSLIPS.find(p=> p.empId===empId && p.period===month);
    if(!payslip){
      banner.innerHTML = `<div class="hint" style="color:var(--bad);margin:-6px 0 10px;">⚠ No payslip found for this employee in ${esc(month)} — enter the amount and deductions manually, or generate the payslip first for it to auto-fill here.</div>`;
      return;
    }
    document.getElementById('expStatutoryAmount').value = payslip.gross;
    document.getElementById('expTdsChk').checked = payslip.tds>0;
    document.getElementById('expTdsFields').style.display = payslip.tds>0 ? 'grid' : 'none';
    if(payslip.tds>0){
      document.getElementById('expTdsRate').value = (payslip.tds/payslip.gross*100).toFixed(4);
      document.getElementById('expTdsFlatAmount').value = payslip.tds; // exact figure — avoids the rate-round-trip precision loss
    } else {
      document.getElementById('expTdsFlatAmount').value = '';
    }
    document.getElementById('expDeductChk').checked = true;
    document.getElementById('expDeductFields').style.display = 'grid';
    document.getElementById('expPF').value = payslip.pfEmployee||0;
    document.getElementById('expPT').value = payslip.pt||0;
    document.getElementById('expESIC').value = payslip.esi||0;
    document.getElementById('expOtherDed').value = 0;
    banner.innerHTML = `<div class="hint" style="color:var(--good);margin:-6px 0 10px;">✓ Auto-filled from the ${esc(month)} payslip — Gross ${money2(payslip.gross)}, Net Pay ${money2(payslip.netPay)}. Adjust any figure below before saving if needed.</div>`;
    drawTotalsPreview();
  }
  document.getElementById('expEmployeeSel').addEventListener('change', autofillFromPayslip);
  document.getElementById('expSalaryMonth').addEventListener('change', autofillFromPayslip);
  if(billTypeSel.value==='SALARY') autofillFromPayslip();
  const refreshTdsBtn = document.getElementById('expRefreshTds');
  if(refreshTdsBtn) refreshTdsBtn.onclick = ()=>{ autofillFromPayslip(); toast('Refreshed from the current payslip — review below, then Save Bill to apply.'); };

  function readForm(){
    const bt = currentBillType();
    return {
      billType: bt,
      billAmount: Number(document.getElementById('expBillAmount').value)||0,
      exchRate: Number(document.getElementById('expExchRate').value)||1,
      gstMode: document.getElementById('expGstMode').value,
      gstPct: Number(document.getElementById('expGstPct').value)||0,
      rcmApplicable: document.getElementById('expRcmChk').checked,
      rcmRate: Number(document.getElementById('expRcmRate').value)||0,
      rcmSupplyType: document.getElementById('expRcmSupply').value,
      cgstOverride: document.getElementById('expCgstOverride').value!=='' ? Number(document.getElementById('expCgstOverride').value) : null,
      sgstOverride: document.getElementById('expSgstOverride').value!=='' ? Number(document.getElementById('expSgstOverride').value) : null,
      igstOverride: document.getElementById('expIgstOverride').value!=='' ? Number(document.getElementById('expIgstOverride').value) : null,
      creditNoteAmount: Number(document.getElementById('expCreditNote').value)||0,
      creditNoteDetails: document.getElementById('expCreditNoteDetails').value,
      tdsApplicable: document.getElementById('expTdsChk').checked,
      tdsRate: Number(document.getElementById('expTdsRate').value)||0,
      tdsFlatAmount: document.getElementById('expTdsFlatAmount').value!=='' ? Number(document.getElementById('expTdsFlatAmount').value) : null,
      deductionsApplicable: document.getElementById('expDeductChk').checked,
      pfAmt: Number(document.getElementById('expPF').value)||0,
      ptAmt: Number(document.getElementById('expPT').value)||0,
      esicAmt: Number(document.getElementById('expESIC').value)||0,
      otherDeduction: Number(document.getElementById('expOtherDed').value)||0,
      statutoryAmount: Number(document.getElementById('expStatutoryAmount').value)||0,
      transferAmount: Number(document.getElementById('expTransferAmount').value)||0,
      paidAmount: Number(document.getElementById('expPaidAmount').value)||0
    };
  }
  function drawTotalsPreview(){
    const bt = currentBillType();
    const tot = calcExpenseTotals(readForm());
    if(document.getElementById('expTaxableDisplay')) document.getElementById('expTaxableDisplay').value = document.getElementById('expBillAmount').value;
    if(document.getElementById('expAmtInrDisplay')) document.getElementById('expAmtInrDisplay').value = tot.amtINR.toFixed(2);
    if(document.getElementById('expTotalBillDisplay')) document.getElementById('expTotalBillDisplay').value = (tot.amtINR + tot.gstTotal).toFixed(2);
    if(bt==='INTERBANK'){
      document.getElementById('expTotalsPreview').innerHTML = `
        <div class="divider"></div>
        <div class="hint">This transfer settles immediately between the two accounts — nothing further to track once saved.</div>`;
      return;
    }
    const payLabel = bt==='SUPPLIER' ? 'Net Payable to Vendor' : bt==='SALARY' ? 'Net Payable to Staff' : 'Net Payable';
    document.getElementById('expTotalsPreview').innerHTML = `
      <div class="divider"></div>
      <div class="grid cols-4">
        <div><label>${bt==='SUPPLIER'?'Bill Amount (INR)':'Amount'}</label><div><b>${money2(tot.amtINR)}</b></div></div>
        ${bt==='SUPPLIER' ? `<div><label>GST Amount${document.getElementById('expRcmChk').checked?' (self-assessed, not paid to vendor)':''}</label><div><b>${money2(tot.gstTotal)}</b></div></div>` : ''}
        ${(bt==='SUPPLIER'||bt==='SALARY') ? `<div><label>TDS Deducted</label><div><b>${money2(tot.tdsAmount)}</b></div></div><div><label>Deductions (PF/PT/ESIC)</label><div><b>${money2(tot.deductionsTotal)}</b></div></div>` : ''}
        <div><label>${payLabel}</label><div><b>${money2(tot.netPayable)}</b></div></div>
        <div><label>${tot.balance<0?'Overpaid':'Balance Due'}</label><div><b style="${tot.balance>0?'color:var(--bad);':(tot.balance<0?'color:var(--good);':'')}">${tot.balance<0?'Overpaid by '+money2(Math.abs(tot.balance)):money2(tot.balance)}</b></div></div>
      </div>`;
  }
  document.getElementById('expTdsChk').addEventListener('change', (ev)=>{
    document.getElementById('expTdsFields').style.display = ev.target.checked?'grid':'none';
    drawTotalsPreview();
  });
  document.getElementById('expTdsSection').addEventListener('change', (ev)=>{
    const s = TDS_SECTION_BY_ID[ev.target.value];
    if(s) document.getElementById('expTdsRate').value = s.defaultRate;
    drawTotalsPreview();
  });
  document.getElementById('expDeductChk').addEventListener('change', (ev)=>{
    document.getElementById('expDeductFields').style.display = ev.target.checked?'grid':'none';
    drawTotalsPreview();
  });
  document.getElementById('expRcmChk').addEventListener('change', (ev)=>{
    const on = ev.target.checked;
    document.getElementById('expRcmHelp').style.display = on?'block':'none';
    document.getElementById('expRcmFields').style.display = on?'grid':'none';
    document.getElementById('expGstMode').disabled = on;
    document.getElementById('expGstPct').disabled = on;
    drawTotalsPreview();
  });
  ['expBillAmount','expExchRate','expGstMode','expGstPct','expRcmRate','expRcmSupply','expTdsRate','expPaidAmount','expPF','expPT','expESIC','expOtherDed','expStatutoryAmount','expTransferAmount','expCgstOverride','expSgstOverride','expIgstOverride','expCreditNote'].forEach(id=> document.getElementById(id).addEventListener('input', drawTotalsPreview));
  document.getElementById('expTdsRate').addEventListener('input', ()=>{ document.getElementById('expTdsFlatAmount').value = ''; });
  const vendorSel = document.getElementById('expVendorSel');
  if(vendorSel) vendorSel.addEventListener('change', ()=>{
    const vendor = PARTIES.find(p=>p.id===vendorSel.value);
    const tdsSectionSel = document.getElementById('expTdsSection');
    if(vendor && vendor.defaultTdsSectionId && tdsSectionSel && (!isEdit || !tdsSectionSel.value)){
      tdsSectionSel.value = vendor.defaultTdsSectionId;
      const sec = TDS_SECTION_BY_ID[vendor.defaultTdsSectionId];
      if(sec){ document.getElementById('expTdsChk').checked = true; document.getElementById('expTdsFields').style.display = 'grid'; document.getElementById('expTdsRate').value = sec.defaultRate; }
      drawTotalsPreview();
    }
  });
  drawTotalsPreview();

  /* Bank details shown here are read from Settings → Company Details — the person doesn't
     retype them for every bill, and if they're blank, this says so plainly rather than
     showing an empty box that looks broken. */
  function paymentDetailFieldsFor(mode){
    if(!mode) return '';
    const hasBank = ORG.bankName || ORG.bankAccNo;
    const bankBlock = mode==='Bank Transfer' ? `
      <div class="field" style="background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin-bottom:10px;">
        <label style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);">Paid From Company Account</label>
        ${hasBank ? `<div style="margin-top:4px;">${esc(ORG.bankName||'—')} · A/c ${esc(ORG.bankAccNo||'—')} · IFSC ${esc(ORG.bankIFSC||'—')}${ORG.bankBranch?(' · '+esc(ORG.bankBranch)):''}</div>`
                  : `<div style="margin-top:4px;color:var(--bad);">No company bank account on file — add one in Settings → Company Details.</div>`}
      </div>` : '';
    const refLabel = mode==='Cheque' ? 'Cheque Number' : (mode==='Bank Transfer'||mode==='UPI') ? 'Transaction Reference / UTR' : mode==='Card' ? 'Card Transaction Reference' : 'Reference (optional)';
    return `${bankBlock}
      <div class="grid cols-2">
        <div class="field"><label>${refLabel}</label><input type="text" name="paymentRef" value="${esc(e.paymentRef)}"></div>
        <div class="field"><label>Date of Payment</label><input type="date" name="paymentDate" value="${esc(e.paymentDate)}"></div>
      </div>`;
  }
  function drawPaymentFields(){
    document.getElementById('expPaymentDetailFields').innerHTML = paymentDetailFieldsFor(document.getElementById('expPaymentMode').value);
  }
  document.getElementById('expPaymentMode').addEventListener('change', drawPaymentFields);
  drawPaymentFields();

  const tallyDropZone = document.getElementById('tallyDropZone'); const tallyFileInput = document.getElementById('tallyFileInput');
  tallyDropZone.onclick = ()=> tallyFileInput.click();
  tallyDropZone.ondragover = (ev)=> ev.preventDefault();
  tallyDropZone.ondrop = async (ev)=>{ ev.preventDefault(); await handleTallyFile(ev.dataTransfer.files[0]); };
  tallyFileInput.onchange = async ()=> handleTallyFile(tallyFileInput.files[0]);
  async function handleTallyFile(f){

  document.getElementById('expForm').onsubmit = async (ev)=>{
    ev.preventDefault();
    if(isEdit){
      const conflict = await checkRecordConflict('expenses', expId, baseRev);
      if(conflict){

          ()=>{ const idx = EXPENSES.findIndex(x=>x.id===expId); if(idx>-1) EXPENSES[idx]=conflict; openExpenseForm(expId); },

  const rec = {
    id: e.id||uid(), billType,

    igstOverride: fd.get('igstOverride')!=='' ? Number(fd.get('igstOverride')) : null,
    creditNoteAmount: Number(fd.get('creditNoteAmount'))||0, creditNoteDetails: (fd.get('creditNoteDetails')||'').trim(),
    rcmApplicable: fd.get('rcmApplicable')==='on', rcmRate: Number(fd.get('rcmRate'))||0, rcmSupplyType: fd.get('rcmSupplyType')||'intra',
    gstr2bClaimMonth: fd.get('gstr2bClaimMonth')||'',
    tdsApplicable: fd.get('tdsApplicable')==='on', tdsSectionId: fd.get('tdsSectionId')||'', tdsRate: Number(fd.get('tdsRate'))||0,
    deductionsApplicable: fd.get('deductionsApplicable')==='on', pfAmt: Number(fd.get('pfAmt'))||0, ptAmt: Number(fd.get('ptAmt'))||0,

    paidFrom: e.paidFrom||'', paymentMode: fd.get('paymentMode')||'',

  if(isEdit){ rec._rev = e._rev; rec.voucherNo = e.voucherNo; }
  else { rec.voucherNo = nextExpNo(); await saveOrg(); }
  tagRecord(rec, !isEdit);

function deleteExpense(id){

}

async function doExport(){
  for(const e of EMPLOYEES){ await loadCompliance(e.id); }
  const payload = { exportedAt: new Date().toISOString(), app: 'Valles Management System', version: 2, org: ORG, employees: EMPLOYEES, payslips: PAYSLIPS, compliance: COMPLIANCE, parties: PARTIES, documents: COMPANY_DOCS, transactions: TRANSACTIONS, expenses: EXPENSES };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `valles-easy-ems-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Backup downloaded.');
}
function doRestore(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    let data; try{ data = JSON.parse(reader.result); }catch(e){ toast('Invalid backup file.', true); return; }
    if(!data.org || !data.employees){ toast('This file does not look like a valid backup.', true); return; }
    openModal(`
      <div class="modal-head"><h3>Confirm Restore</h3><button class="modal-close" id="mClose">✕</button></div>
      <p>This will replace all current data with the backup from <b>${esc(data.exportedAt||'unknown date')}</b>, containing ${data.employees.length} employee(s) and ${(data.payslips||[]).length} payslip(s). This cannot be undone.</p>
      <div class="btn-row"><button class="btn danger" id="confirmRestore">Restore &amp; Overwrite</button><button class="btn secondary" id="mCancel">Cancel</button></div>
    `);
    document.getElementById('mClose').onclick = closeModal; document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('confirmRestore').onclick = async ()=>{
      await applyRestoredPayload(data);
      closeModal(); toast('Backup restored.'); setTab('dashboard');
    };
  };
  reader.readAsText(file);
}

      <div class="field" style="max-width:340px;">

        <input type="number" min="0" step="1" id="ptAnnualCapVal" value="${ORG.ptAnnualCap||0}">

    <div class="card">
      <h2>Income Tax Rules <span class="tag">both regimes, editable</span></h2>
      <p style="color:var(--muted);font-size:13px;">These are the exact rules the payslip tax engine uses. When a Budget changes slabs, thresholds, cess or surcharge, update them here — no code change needed. Slab rows are annual taxable-income brackets; leave the last row's "Up To" blank for "and above". Surcharge rows are annual-income thresholds above which that surcharge rate applies.</p>

        <div class="hint" style="margin:14px 0 6px;">Surcharge Tiers (annual taxable income above, ₹)</div>
        <div data-slabwrap="${key}-surcharge"></div>
        <button type="button" class="btn secondary sm" data-addsurcharge="${key}">+ Add Surcharge Tier</button>
      `; }).join('')}

      <div class="btn-row" style="margin-top:14px;"><button class="btn sm" id="saveTaxRules">Save Income Tax Rules</button></div>
    </div>

    <div class="card">
      <h2>TDS Filing Details</h2>
      <p style="color:var(--muted);font-size:13px;">Feeds the header of the monthly TDS Calculation report in Tax Compliance. The report codes below (e.g. "393(1)-1009") are pre-filled as a starting point from a sample return — <b>verify these against your own TAN's actual filing requirements before relying on them</b>, since the exact code can vary by how your return is prepared.</p>

        <div class="field"><label>Type of Payment</label><input type="text" id="tdsPaymentTypeField" value="${esc(ORG.typeOfPayment)}"></div>

        ${TDS_SECTIONS.map(s=>`<div class="field" style="margin-bottom:0;"><label>${esc(s.oldCode)} — ${esc(s.description)}</label><input type="text" data-repcode="${s.id}" value="${esc(ORG.tdsReportCodes[s.id]||'')}"></div>`).join('')}
      </div>
      <div class="btn-row" style="margin-top:14px;"><button class="btn sm" id="saveTdsFilingBtn">Save TDS Filing Details</button></div>

    <div class="card">
      <h2>CTC Structuring Policy</h2>
      <p style="color:var(--muted);font-size:13px;">Governs how "Revise by CTC" turns a single Cost-to-Company figure into a full monthly breakdown: <b>Basic</b> is set as this % of CTC; <b>HRA</b> = 50% of Basic; <b>Children Education</b> is fixed; <b>LTA</b> = Basic ÷ 12; <b>PF Employee</b> and <b>PF Employer</b> are each 12% of Basic (or the capped wage, per the ceiling setting above); <b>Professional Tax</b> follows the slabs above; and <b>Other Allowance</b> is the balancing figure that makes everything reconcile exactly back to the CTC entered. This mirrors how your management structures pay — adjust the ratio to match company policy.</p>
      <div class="grid cols-3">
        <div class="field"><label>Basic as % of CTC</label><input type="number" step="0.01" min="1" max="99" id="basicPctField" value="${(ORG.ctcPolicy.basicPct*100).toFixed(2)}"></div>

    <div class="card">
      <h2>Salary Revision <span class="tag">admin only</span></h2>

      ${EMPLOYEES.length ? `
        <table><thead><tr><th>Employee</th><th>Current Gross</th><th>Regime</th><th>Effective From</th><th>Revisions</th><th></th></tr></thead><tbody>
        ${EMPLOYEES.map(e=>{ const s = currentSalary(e); const g = grossOf(s); return `<tr>
          <td><b>${esc(e.name)}</b><div style="color:var(--muted);font-size:11.5px;">${esc(e.empCode)}</div></td>
          <td class="num-cell">${money(g)}</td>
          <td><span class="pill ${regimePillClass(s.taxRegime)}">${regimeLabel(s.taxRegime)}</span></td>
          <td>${esc(s.effectiveFrom||'—')}</td>
          <td>${(e.salaryHistory||[]).length}</td>
          <td><button class="btn sm" data-revise="${e.id}">↻ Revise Salary</button></td>
        </tr>`; }).join('')}
        </tbody></table>
      ` : '<div class="empty" style="padding:16px;">No employees yet — add one from the Staff tab.</div>'}
    </div>

    <div class="card">
      <h2>Admin Password</h2>
      <form id="pwForm">
        <div class="grid cols-2">
          <div class="field"><label>Current Password</label><input type="password" name="cur" required></div>
          <div class="field"><label>New Password</label><input type="password" name="nw" required></div>
        </div>
        <div class="btn-row"><button type="submit" class="btn secondary">Change Password</button></div>

    <div class="card">
      <h2>Working as</h2>
      <p style="color:var(--muted);font-size:13px;">Since a few of you may use this app at the same time, your name is tagged on the changes you make. This is how the app knows whose edit is newest if two people touch the same record, and who to name in a conflict warning.</p>
      <div class="field" style="max-width:280px;"><label>Your Name</label><input type="text" id="staffNameField" value="${esc(currentStaffName())}" placeholder="e.g. Priya"></div>
      <button class="btn secondary sm" id="saveStaffName">Save Name</button>
      ${(()=>{ const la = lastActivity(); return la ? `<div class="hint" style="margin-top:10px;">Most recent change anywhere: <b>${esc(la.by)}</b> · ${esc(timeAgo(la.at))}</div>` : ''; })()}
    </div>

    <div class="card">
      <h2>Export / Restore Backup (Manual File)</h2>
      <p style="color:var(--muted);font-size:13px;">A downloadable snapshot as an alternative to Google Drive — company profile, employees with full salary history, payslips, compliance, parties, documents, transactions and expenses.</p>
      <div class="btn-row"><button class="btn secondary sm" id="exportBtn">⬇ Export Full Backup (.json)</button></div>
      <div class="section-label" style="margin-top:14px;">Restore from a File</div>
      <p class="hint" style="margin:-4px 0 8px;">Overwrites all current data with the contents of the file — make sure it's the right one.</p>
      <div class="file-drop" id="restoreDrop">Click to choose a backup .json file</div>
      <input type="file" id="restoreInput" accept="application/json" style="display:none;">
    </div>

    <div class="card">
      <h2>Storage Usage</h2>
      <p style="color:var(--muted);font-size:13px;">Everything below lives in this browser's local storage, which most browsers cap around 5–10MB total. If saves start failing ("browser storage may be full"), this is where to find what to remove — usually large scanned bill/document images.</p>
      <div id="storageUsageWrap"></div>
      <div class="btn-row" style="margin-top:10px;"><button class="btn" id="migrateAttachmentsBtn">☁ Migrate Attachments to Google Drive</button></div>
      <p class="hint" style="margin-top:6px;">Moves existing attachments out of local storage into your Google Drive folder, replacing each with a small reference — frees up the space shown above. Requires Google Drive to be connected.</p>
    </div>

    <div class="card">
      <h2>Google Drive Backup &amp; Sync</h2>
      <p style="color:var(--muted);font-size:13px;">Connects this app (hosted on GitHub Pages) to a folder in <b>your own</b> Google Drive. <code>data.json</code> there is kept live — synced a few seconds after any change, and automatically every <b>20 seconds</b> as a backstop, so it stays current across every window/tab you have this app open in. The same sync also keeps a <b>Google Sheet</b> up to date, with one tab each for Employees, Salary History, Payslips and Compliance. "Backup Now" additionally keeps a rolling set of the <b>last 5</b> dated JSON snapshots you can restore from. See README.md for the one-time Google Cloud setup. This app only ever touches files/folders it creates — nothing else in your Drive.</p>
      <div class="field"><label>Google OAuth Client ID</label><input type="text" id="gClientId" placeholder="xxxxxxxxxx.apps.googleusercontent.com" value="${esc(ORG.gdrive.clientId||'')}"></div>
      <div class="btn-row" style="margin-bottom:10px;">
        <button class="btn secondary sm" id="saveClientId">Save Client ID</button>
        ${driveConnected() ? '<button class="btn sm" id="disconnectDrive">Disconnect</button>' : '<button class="btn sm" id="connectDriveBtn">Connect Google Drive</button>'}
      </div>
      ${driveConnected() ? `
        <div style="font-size:13px;color:var(--muted);margin-bottom:10px;" id="driveLastSync">${ORG.gdrive.lastSynced?('Last synced '+new Date(ORG.gdrive.lastSynced).toLocaleString('en-IN')+' · auto-syncs every 20s'):'Not yet synced'}</div>
        <div class="btn-row" style="margin-bottom:10px;">
          <button class="btn sm" id="driveBackupBtn">⬆ Backup Now to Drive</button>
          <button class="btn secondary sm" id="driveSheetBtn">📊 Sync Google Sheet Now</button>
          ${ORG.gdrive.sheetId ? `<a class="btn secondary sm" href="https://docs.google.com/spreadsheets/d/${ORG.gdrive.sheetId}/edit" target="_blank" rel="noopener">↗ Open Sheet</a>` : ''}
          ${ORG.gdrive.folderId ? `<a class="btn secondary sm" href="https://drive.google.com/drive/folders/${ORG.gdrive.folderId}" target="_blank" rel="noopener">↗ Open Folder</a>` : ''}
        </div>
        <div class="section-label">Last 5 Backups in Drive</div>
        <div id="driveBackupList"><div class="empty" style="padding:12px;">Loading…</div></div>
      ` : `<div style="font-size:13px;color:var(--muted);">Not connected. Paste a Client ID and click Connect to begin.</div>`}
    </div>

    ${(ORG.gdrive && ORG.gdrive.connected) ? `
    <div class="card">
      <h2>Data Recovery — Version History</h2>
      <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-soft);margin-bottom:12px;">
        ⚠ Restoring a slot overwrites <b>only that data file's</b> current content with the chosen backup — everything else stays as it is. Your current data for that file is backed up first, so a restore can itself be undone. Backups are the same rolling 5 shown above — Slot 1 is the most recent, Slot 5 the oldest.
      </div>
      <div id="recoveryGridWrap"><div class="empty" style="padding:12px;">Loading…</div></div>
    </div>` : ''}

    <div class="card">
      <h2>Pin Drive Folder &amp; Sheet <span class="tag">recommended for multiple staff</span></h2>
      <p style="color:var(--muted);font-size:13px;">Without this, a brand-new device figures out which folder/sheet to use by searching Drive for them by name — reliable, but not bulletproof (e.g. it breaks if the company name is ever changed, since the sheet's name would no longer match). <b>Pinning removes the guesswork entirely</b>: paste the exact IDs once here, and every device that has this Client ID configured uses those exact resources from the start, with zero risk of ever creating a duplicate. If this device is already connected and syncing correctly, just click "Use This Device's Current IDs" below, then copy the two values shown to every other device's Settings.</p>
      <div class="grid cols-2">
        <div class="field"><label>Pinned Drive Folder ID</label><input type="text" id="pinFolderId" placeholder="e.g. 1a2B3cD4EfGhIjKlmnOP" value="${esc(ORG.gdrive.pinnedFolderId||'')}"></div>
        <div class="field"><label>Pinned Google Sheet ID</label><input type="text" id="pinSheetId" placeholder="e.g. 1XyZ...longId...789" value="${esc(ORG.gdrive.pinnedSheetId||'')}"></div>
      </div>
      <div class="btn-row">
        ${driveConnected() && ORG.gdrive.folderId ? `<button class="btn secondary sm" id="usePinCurrent">Use This Device's Current IDs</button>` : ''}
        <button class="btn sm" id="savePinIds">Save Pinned IDs</button>
        <button class="btn danger sm" id="clearPinIds">Clear Pins</button>
      </div>
      <p class="hint">The IDs are also the long string in each resource's URL — e.g. in <code>drive.google.com/drive/folders/<b>THIS-PART</b></code> and <code>docs.google.com/spreadsheets/d/<b>THIS-PART</b>/edit</code>.</p>
    </div>
  `;
  document.getElementById('orgForm').onsubmit = async (ev)=>{
    ev.preventDefault(); const fd = new FormData(ev.target);
    ['companyName','cin','pan','tan','gstin','tel','email','address','bankName','bankAccNo','bankIFSC','bankBranch'].forEach(k=> ORG[k] = fd.get(k) ? fd.get(k).trim() : '');
    await saveOrg(); refreshBrand(); toast('Company details saved.');
  };
  const logoDrop = document.getElementById('logoDrop'); logoDrop.onclick = ()=> document.getElementById('logoInput').click();
  document.getElementById('logoInput').onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return; const res = await readFileAsDataURL(f);
    ORG.logo = res.data; await saveOrg(); refreshBrand(); toast('Logo updated.'); renderSettings(c,actions);
  };
  const rmLogo = document.getElementById('removeLogo');
  if(rmLogo) rmLogo.onclick = async ()=>{ ORG.logo=''; await saveOrg(); refreshBrand(); renderSettings(c,actions); };
  (function renderStorageUsage(){
    const wrap = document.getElementById('storageUsageWrap'); if(!wrap) return;
    ensureLocal();
    let raw = ''; try{ raw = localStorage.getItem(LS_KEY) || ''; }catch(e){}
    const totalBytes = new Blob([raw]).size;
    const limitBytes = 8*1024*1024; // most browsers cap around 5-10MB; 8MB is a reasonable working estimate
    const pctUsed = Math.min(100, Math.round(totalBytes/limitBytes*100));

    // Gather every individual attachment across every module, with where it lives, so the
    // largest ones can be found and removed directly instead of guessing.
    const items = [];
    EXPENSES.forEach(e=>{
      (e.billAttachments||e.attachments||[]).forEach(f=> items.push({label:`Bill: ${e.voucherNo||'(unsaved)'} — ${f.name}`, size:f.size||0, area:'Bills & Expenses', onDrive:!!f.driveFileId}));
      (e.receiptAttachments||[]).forEach(f=> items.push({label:`Receipt: ${e.voucherNo||'(unsaved)'} — ${f.name}`, size:f.size||0, area:'Bills & Expenses', onDrive:!!f.driveFileId}));
      if(e.tallyAttachment) items.push({label:`Tally voucher: ${e.voucherNo||'(unsaved)'} — ${e.tallyAttachment.name}`, size:e.tallyAttachment.size||0, area:'Bills & Expenses', onDrive:!!e.tallyAttachment.driveFileId});
    });
    COMPANY_DOCS.forEach(d=> (d.attachments||[]).forEach(f=> items.push({label:`Document: ${d.docName} — ${f.name}`, size:f.size||0, area:'Documents', onDrive:!!f.driveFileId})));
    Object.entries(COMPLIANCE).forEach(([empId,recs])=>{
      const emp = EMPLOYEES.find(x=>x.id===empId);
      (recs||[]).forEach(r=> (r.files||[]).forEach(f=> items.push({label:`Compliance (${emp?emp.name:empId}): ${f.name}`, size:f.size||0, area:'Compliance', onDrive:!!f.driveFileId})));
    });
    const byArea = {};
    items.forEach(i=>{ byArea[i.area] = (byArea[i.area]||0) + i.size; });
    const top10 = items.slice().sort((a,b)=> b.size-a.size).slice(0,10);

    wrap.innerHTML = `
      <div class="grid cols-2">
        <div><label>Total Local Storage Used</label><div><b style="${pctUsed>80?'color:var(--bad);':''}">${(totalBytes/1024/1024).toFixed(2)} MB (~${pctUsed}% of typical browser limit)</b></div></div>
        <div><label>Total Attachments</label><div><b>${items.length}</b> across ${Object.keys(byArea).length} area(s)</div></div>
      </div>
      ${Object.keys(byArea).length ? `<div class="section-label" style="margin-top:10px;">By Area</div><div class="grid cols-3">${Object.entries(byArea).map(([area,sz])=>`<div><label>${esc(area)}</label><div>${(sz/1024/1024).toFixed(2)} MB</div></div>`).join('')}</div>` : ''}
      ${top10.length ? `<div class="section-label" style="margin-top:10px;">Largest Individual Attachments</div>
      <table><thead><tr><th>File</th><th>Area</th><th>Status</th><th class="num-cell">Size</th></tr></thead><tbody>
        ${top10.map(i=>`<tr><td>${esc(i.label)}</td><td>${esc(i.area)}</td><td>${i.onDrive?'<span class="pill good">☁ On Drive</span>':'<span class="pill neutral">💾 Local only</span>'}</td><td class="num-cell">${(i.size/1024).toFixed(0)} KB</td></tr>`).join('')}
      </tbody></table>` : '<div class="hint" style="margin-top:8px;">No attachments recorded yet.</div>'}
    `;
  })();
  const migrateBtn = document.getElementById('migrateAttachmentsBtn');
  if(migrateBtn) migrateBtn.onclick = async ()=>{
    if(!driveConnected() || !ORG.gdrive || !ORG.gdrive.connected){ toast('Connect Google Drive first (below) before migrating attachments.', true); return; }
    migrateBtn.disabled = true;
    // Collect every attachment that's still stored inline (has .data, no .driveFileId yet)
    // across every module, so it can be uploaded and replaced with a lightweight reference.
    const jobs = [];
    EXPENSES.forEach(e=>{
      (e.billAttachments||e.attachments||[]).forEach((f,i)=>{ if(f.data && !f.driveFileId) jobs.push({f, kind:'expense', record:e, apply:(uploaded)=>{ const arr=(e.billAttachments||e.attachments); arr[i]=uploaded; }}); });
      (e.receiptAttachments||[]).forEach((f,i)=>{ if(f.data && !f.driveFileId) jobs.push({f, kind:'expense', record:e, apply:(uploaded)=>{ e.receiptAttachments[i]=uploaded; }}); });
      if(e.tallyAttachment && e.tallyAttachment.data && !e.tallyAttachment.driveFileId) jobs.push({f:e.tallyAttachment, kind:'expense', record:e, apply:(uploaded)=>{ e.tallyAttachment=uploaded; }});
    });
    COMPANY_DOCS.forEach(d=> (d.attachments||[]).forEach((f,i)=>{ if(f.data && !f.driveFileId) jobs.push({f, kind:'doc', record:d, apply:(uploaded)=>{ d.attachments[i]=uploaded; }}); }));
    const complianceTouched = new Set();
    Object.entries(COMPLIANCE).forEach(([empId,recs])=> (recs||[]).forEach(r=> (r.files||[]).forEach((f,i)=>{ if(f.data && !f.driveFileId) jobs.push({f, kind:'compliance', record:r, empId, apply:(uploaded)=>{ r.files[i]=uploaded; complianceTouched.add(empId); }}); })));

    if(!jobs.length){ toast('Nothing to migrate — no inline attachments found.'); migrateBtn.disabled=false; return; }
    let done = 0, failed = 0;
    for(const job of jobs){
      migrateBtn.textContent = `Migrating ${done+1} of ${jobs.length}…`;
      try{ const uploaded = await driveUploadAttachmentFile(job.f); job.apply(uploaded); done++; }
      catch(e){ failed++; }
    }
    // Bump _rev on every touched record so the merge system recognizes this as a genuine
    // change — without this, a concurrent sync from another device could silently overwrite
    // the migrated (smaller) record with an older, un-migrated one still holding inline data.
    // Using the direct record reference captured when each job was created, not array
    // membership — the original attachment object no longer exists in its array by this
    // point, since apply() already replaced it with the lightweight reference.
    new Set(jobs.filter(j=>j.kind==='expense').map(j=>j.record)).forEach(e=> tagRecord(e, false));
    new Set(jobs.filter(j=>j.kind==='doc').map(j=>j.record)).forEach(d=> tagRecord(d, false));
    new Set(jobs.filter(j=>j.kind==='compliance').map(j=>j.record)).forEach(r=> tagRecord(r, false));
    await saveExpenses(); await saveCompanyDocs();
    for(const empId of complianceTouched){ await saveCompliance(empId); }
    // Push to Drive right now rather than waiting for the normal debounced sync — otherwise
    // a hard refresh shortly after migrating could catch the smaller local state before it's
    // actually reached Drive, and pull the old, larger version straight back in on reconnect.
    migrateBtn.textContent = 'Syncing to Drive…';
    driveDirty = true;
    try{ await driveSyncNow(); }catch(e){}
    migrateBtn.disabled = false; migrateBtn.textContent = '☁ Migrate Attachments to Google Drive';
    toast(`Migrated ${done} attachment(s) to Drive${failed?`, ${failed} failed — retry to pick up the rest`:''}.`, failed>0);
    renderSettings(c, actions);
  };
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = doExport;
  const restoreDrop = document.getElementById('restoreDrop');
  if(restoreDrop){
    restoreDrop.onclick = ()=> document.getElementById('restoreInput').click();
    document.getElementById('restoreInput').onchange = (e)=>{ const f = e.target.files[0]; if(f) doRestore(f); };
  }
  const saveTxnBtn = document.getElementById('saveTxnSettings');
  if(saveTxnBtn) saveTxnBtn.onclick = async ()=>{
    ORG.allowFinalisedTxnEdit = document.getElementById('allowTxnEditChk').checked;

/* Shows what's actually inside a Drive backup — a breakdown per module — before deciding
   whether to restore it. Fetches the file on demand rather than keeping all 5 backups'
   content loaded at once. */
/* Per-module version history — same 5 rolling Drive backups already shown above, but lets
   you restore just ONE data file (e.g. only Payslips) from a specific slot, leaving
   everything else untouched, instead of an all-or-nothing whole-app restore. */
const RECOVERY_MODULES = [
  { key:'employees', label:'Staff', category:'People' },
  { key:'payslips', label:'Payslips', category:'People' },
  { key:'compliance', label:'Compliance', category:'People' },
  { key:'transactions', label:'Transactions', category:'Transactions & Bills' },
  { key:'expenses', label:'Bills & Expenses', category:'Transactions & Bills' },
  { key:'parties', label:'Parties', category:'Company' },
  { key:'documents', label:'Documents', category:'Company' },
  { key:'org', label:'Company Settings', category:'Company' },
];
let _backupContentCache = {};
async function fetchBackupCached(fileId){
  if(_backupContentCache[fileId]) return _backupContentCache[fileId];
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  const data = await res.json();
  _backupContentCache[fileId] = data;
  return data;
}
function extractModuleData(payload, key){ return payload ? payload[key] : undefined; }
function moduleRecordCount(key, data){
  if(data==null) return 0;
  if(key==='compliance') return Object.values(data).reduce((s,arr)=> s+(arr||[]).length, 0);
  if(key==='org') return data.companyName ? 1 : 0;
  return Array.isArray(data) ? data.length : 0;
}
async function applyModuleRestore(key, data){
  if(key==='employees'){ EMPLOYEES = data||[]; await saveEmployees(); }
  else if(key==='payslips'){ PAYSLIPS = data||[]; await savePayslips(); }
  else if(key==='compliance'){ COMPLIANCE = data||{}; for(const empId of Object.keys(COMPLIANCE)) await saveCompliance(empId); }
  else if(key==='transactions'){ TRANSACTIONS = data||[]; await saveTransactions(); }
  else if(key==='expenses'){ EXPENSES = data||[]; await saveExpenses(); }
  else if(key==='parties'){ PARTIES = data||[]; await saveParties(); }
  else if(key==='documents'){ COMPANY_DOCS = data||[]; await saveCompanyDocs(); }
  else if(key==='org'){ const gdriveKeep = ORG.gdrive; ORG = data||ORG; ORG.gdrive = gdriveKeep; backfillOrgDefaults(); await saveOrg(); }
}
async function viewModuleSlot(fileId, moduleKey, label, slotLabel){
  const mod = RECOVERY_MODULES.find(m=>m.key===moduleKey);
  openModal(`<div class="modal-head"><h3>${esc(mod.label)} — ${esc(slotLabel)}</h3><button class="modal-close" id="mClose">✕</button></div><div class="empty" style="padding:20px;">Loading…</div>`);
  document.getElementById('mClose').onclick = closeModal;
  try{
    const payload = await fetchBackupCached(fileId);
    const data = extractModuleData(payload, moduleKey);
    const count = moduleRecordCount(moduleKey, data);
    openModal(`
      <div class="modal-head"><h3>${esc(mod.label)} — ${esc(slotLabel)}</h3><button class="modal-close" id="mClose">✕</button></div>
      <p>${esc(label)}</p>
      <div class="grid cols-2"><div><label>Records in this slot</label><div><b>${count}</b></div></div></div>
      <div class="btn-row" style="margin-top:14px;"><button class="btn danger" id="viewToRestoreModule">Restore Just ${esc(mod.label)} From This Slot</button><button class="btn secondary" id="mCancel">Close</button></div>
    `, true);
    document.getElementById('mClose').onclick = closeModal; document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('viewToRestoreModule').onclick = ()=>{ closeModal(); restoreModuleSlot(fileId, moduleKey, label); };
  }catch(e){
    openModal(`<div class="modal-head"><h3>${esc(mod.label)}</h3><button class="modal-close" id="mClose">✕</button></div><div class="empty" style="padding:20px;color:var(--bad);">Could not load: ${esc(e.message)}</div>`);
    document.getElementById('mClose').onclick = closeModal;
  }
}
async function restoreModuleSlot(fileId, moduleKey, label){
  const mod = RECOVERY_MODULES.find(m=>m.key===moduleKey);
  openModal(`
    <div class="modal-head"><h3>Restore ${esc(mod.label)}</h3><button class="modal-close" id="mClose">✕</button></div>
    <p>This replaces the current <b>${esc(mod.label)}</b> data with the version from <b>${esc(label)}</b>. Nothing else in the app is touched. Your current ${esc(mod.label)} data is backed up first, so this can itself be undone.</p>
    <div class="btn-row"><button class="btn danger" id="confirmModuleRestore">Restore ${esc(mod.label)}</button><button class="btn secondary" id="mCancel">Cancel</button></div>
  `);
  document.getElementById('mClose').onclick = closeModal; document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('confirmModuleRestore').onclick = async ()=>{
    const btn = document.getElementById('confirmModuleRestore'); btn.disabled = true; btn.textContent = 'Backing up current data…';
    try{
      await driveBackupNow(); // safety net — current state becomes a fresh Slot 1 before we overwrite anything
      btn.textContent = 'Restoring…';
      const payload = await fetchBackupCached(fileId);
      const data = extractModuleData(payload, moduleKey);
      await applyModuleRestore(moduleKey, data);
      closeModal(); toast(`${mod.label} restored from ${label}.`); render();
    }catch(e){ toast('Restore failed: '+e.message, true); btn.disabled=false; btn.textContent='Restore '+mod.label; }
  };
}
function renderRecoveryGrid(files){
  const wrap = document.getElementById('recoveryGridWrap'); if(!wrap) return;
  if(!files.length){ wrap.innerHTML = '<div class="empty" style="padding:12px;">No backups yet — click "Backup Now to Drive" above first.</div>'; return; }
  const categories = [...new Set(RECOVERY_MODULES.map(m=>m.category))];
  wrap.innerHTML = categories.map(cat=>`
    <div class="section-label" style="margin-top:14px;">${esc(cat)}</div>
    <div style="overflow-x:auto;">
    <table><thead><tr><th>Data File</th>${files.map((f,i)=>`<th>Slot ${i+1}${i===0?' (newest)':''}${i===files.length-1&&files.length===5?' (oldest)':''}</th>`).join('')}</tr></thead><tbody>
      ${RECOVERY_MODULES.filter(m=>m.category===cat).map(m=>`
        <tr><td><b>${esc(m.label)}</b></td>
        ${files.map(f=>{
          const label = `${f.name} — ${new Date(f.createdTime).toLocaleString('en-IN')}`;
          return `<td style="white-space:nowrap;"><button type="button" class="btn secondary sm" data-viewslot="${f.id}" data-mod="${m.key}" data-label="${esc(label)}" title="View">👁</button> <button type="button" class="btn secondary sm" data-restoreslot="${f.id}" data-mod="${m.key}" data-label="${esc(label)}" title="Restore">↺</button></td>`;
        }).join('')}
        </tr>`).join('')}
    </tbody></table>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-viewslot]').forEach(b=> b.onclick = ()=> viewModuleSlot(b.dataset.viewslot, b.dataset.mod, b.dataset.label, b.dataset.label));
  wrap.querySelectorAll('[data-restoreslot]').forEach(b=> b.onclick = ()=> restoreModuleSlot(b.dataset.restoreslot, b.dataset.mod, b.dataset.label));
}
async function viewDriveBackupDetail(fileId, label){
  openModal(`<div class="modal-head"><h3>${esc(label)}</h3><button class="modal-close" id="mClose">✕</button></div><div class="empty" style="padding:20px;">Loading…</div>`);
  document.getElementById('mClose').onclick = closeModal;
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const data = await res.json();
    const complianceCount = Object.values(data.compliance||{}).reduce((s,arr)=> s+(arr||[]).length, 0);
    const salaryRevisionCount = (data.employees||[]).reduce((s,e)=> s+((e.salaryHistory||[]).length), 0);
    const rows = [
      ['Company', data.org ? esc(data.org.companyName||'—') : '—'],
      ['Exported / Saved At', data.savedAt||data.exportedAt||'—'],
      ['Employees', (data.employees||[]).length + ` (with ${salaryRevisionCount} salary revision(s) total)`],
      ['Payslips', (data.payslips||[]).length],
      ['Compliance Records', complianceCount],
      ['Parties', (data.parties||[]).length],
      ['Documents', (data.documents||[]).length],
      ['Transactions', (data.transactions||[]).length],
      ['Bills & Expenses', (data.expenses||[]).length],
    ];
    openModal(`
      <div class="modal-head"><h3>${esc(label)}</h3><button class="modal-close" id="mClose">✕</button></div>
      <table><tbody>
        ${rows.map(r=>`<tr><td class="lbl" style="width:45%;">${esc(String(r[0]))}</td><td class="val">${esc(String(r[1]))}</td></tr>`).join('')}
      </tbody></table>
      <div class="btn-row" style="margin-top:14px;"><button class="btn danger" id="viewToRestore">Restore This Backup</button><button class="btn secondary" id="mCancel">Close</button></div>
    `, true);
    document.getElementById('mClose').onclick = closeModal; document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('viewToRestore').onclick = ()=>{ closeModal(); driveRestoreBackup(fileId, label); };
  }catch(e){
    openModal(`<div class="modal-head"><h3>${esc(label)}</h3><button class="modal-close" id="mClose">✕</button></div><div class="empty" style="padding:20px;color:var(--bad);">Could not load this backup: ${esc(e.message)}</div>`);
    document.getElementById('mClose').onclick = closeModal;
  }
}

/* ============================= INIT ============================= */
(async function init(){
  await loadAll();
  updateDocBadge();
  setTab('dashboard'); // paint immediately — don't block first render on compliance or Drive
  Promise.all(EMPLOYEES.map(e=> loadCompliance(e.id))).then(()=>{
    updateCompBadge();
    if(activeTab==='staff') render(); // refresh the compliance badge if already viewing it
  });
  if(ORG.gdrive && ORG.gdrive.connected){ attemptSilentDriveReconnect(); startAutoSyncLoop(); startPresenceLoop(); ensureStaffName(); }
})();
</script>
